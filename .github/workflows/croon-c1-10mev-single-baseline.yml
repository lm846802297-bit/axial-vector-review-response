name: Croon C1 10 MeV mode-resolved single-mass baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-10mev-mode-resolved:
    if: github.ref == 'refs/heads/research/croon-vector-benchmark-and-rate-corrections-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision, runtime, and input identity
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run C1 equation, detailed-balance, and boundary tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_croon_c1_b13_vector_transport.py
      - name: Compute isolated 10 MeV C1 transport on the reviewed profile
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python croon_c1_b13_vector_transport.py \
            --masses 10.0 \
            --radial-points 101 \
            --energy-order 32 \
            --inner-orders 12,8,8,8 \
            --neutrino-order 128 \
            --susceptibility-order 192 \
            --coupling-count 121 \
            --output outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.json \
            --csv outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.csv
      - name: Validate JSON, CSV, detailed balance, shell closure, and finite values
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          jp = Path("outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.json")
          cp = Path("outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.csv")
          data = json.loads(jp.read_text())
          assert data["status"].startswith("C1 interior-profile")
          assert list(data["masses"]) == ["10"]
          item = data["masses"]["10"]
          assert item["mass_MeV"] == 10.0
          assert item["radial_points"] >= 101
          assert item["energy_points"] == 32
          modes = ("L", "+", "-")
          assert item["polarization_modes"] == list(modes)
          assert len(item["coupling_curve"]) == 121
          assert len(item["local_profile"]) == item["radial_points"]
          assert item["maximum_B7_mode_detailed_balance_residual"] < 1e-10
          assert item["maximum_B13_charge_mode_detailed_balance_residual"] < 1e-10
          assert item["maximum_final_muon_shell_relative_error"] < 2e-10
          for key, value in item["thin_source_per_g2_erg_s"].items():
              assert math.isfinite(value) and value >= 0, (key, value)
          for key, by_mode in item["thin_source_by_mode_per_g2_erg_s"].items():
              assert set(by_mode) == set(modes), (key, by_mode)
              assert all(math.isfinite(v) and v >= 0 for v in by_mode.values())
              total = item["thin_source_per_g2_erg_s"][key]
              residual = abs(sum(by_mode.values()) - total) / max(abs(total), 1e-300)
              assert residual < 1e-12, (key, residual)
          assert max(item["thin_source_mode_sum_relative_residuals"].values()) < 1e-12
          for row in item["coupling_curve"]:
              assert 0 < row["g_X"] <= 1
              for key in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                  assert math.isfinite(row[key]) and row[key] >= 0, (key, row[key])
                  by_mode = row[key + "_by_mode_erg_s"]
                  assert set(by_mode) == set(modes)
                  assert all(math.isfinite(v) and v >= 0 for v in by_mode.values())
                  residual = abs(sum(by_mode.values()) - row[key]) / max(abs(row[key]), 1e-300)
                  assert residual < 1e-12, (key, residual)
                  assert row[key + "_mode_sum_relative_residual"] < 1e-12
          with cp.open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == item["radial_points"]
          for row in rows:
              for key in ("r_km", "T_MeV", "Q_B7_nu_mu_plus_nu_tau_per_g2_MeV5",
                          "Q_B13_mu_minus_per_g2_MeV5", "Q_B13_mu_plus_per_g2_MeV5",
                          "Q_B13_mu_pm_per_g2_MeV5", "Q_B7_plus_B13_per_g2_MeV5"):
                  assert math.isfinite(float(row[key])), (key, row[key])
              for channel in ("B7", "B13_mu_minus", "B13_mu_plus",
                              "B13_mu_pm", "B7_plus_B13"):
                  mode_values = [float(row[f"Q_{channel}_{mode}_per_g2_MeV5"])
                                 for mode in modes]
                  total_key = {
                      "B7": "Q_B7_nu_mu_plus_nu_tau_per_g2_MeV5",
                      "B13_mu_minus": "Q_B13_mu_minus_per_g2_MeV5",
                      "B13_mu_plus": "Q_B13_mu_plus_per_g2_MeV5",
                      "B13_mu_pm": "Q_B13_mu_pm_per_g2_MeV5",
                      "B7_plus_B13": "Q_B7_plus_B13_per_g2_MeV5",
                  }[channel]
                  total = float(row[total_key])
                  residual = abs(sum(mode_values) - total) / max(abs(total), 1e-300)
                  assert residual < 1e-12, (channel, residual)
          print("C1 10 MeV JSON/CSV, three-polarization closure, and physical-kernel checks: PASS")
          print("radial rows:", len(rows), "energy nodes:", item["energy_points"],
                "coupling points:", len(item["coupling_curve"]))
          print("max B7 DB:", item["maximum_B7_mode_detailed_balance_residual"])
          print("max B13 DB:", item["maximum_B13_charge_mode_detailed_balance_residual"])
          print("max final-muon shell residual:", item["maximum_final_muon_shell_relative_error"])
          PY
      - name: Create SHA-256 manifest for native outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.json \
            outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.csv \
            > outputs/SHA256SUMS_croon_c1_10mev_mode_resolved_2026-11-20.txt
      - name: Upload native outputs and checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-10mev-mode-resolved-2026-11-20
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_mode_resolved_2026-11-20.txt
          if-no-files-found: error
      - name: Commit native calculation outputs to the research branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_mode_resolved_2026-11-20.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_mode_resolved_2026-11-20.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive isolated C1 10 MeV single-mass baseline"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
            done
            exit 1
          fi
