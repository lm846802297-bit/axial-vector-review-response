name: Independent Higgs-scalar fermion matrix validation

on:
  push:
    branches:
      - research/major1-higgs-scalar-mixing-20261109
    paths:
      - "research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.py"
      - "research/major1-higgs-scalar-mixing-20261109/test_independent_fermion_sector_matrix_audit.py"
      - ".github/workflows/independent-higgs-scalar-matrix-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: independent-higgs-scalar-matrix-audit
  cancel-in-progress: false

jobs:
  independent-fermion-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install independent numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0

      - name: Run independent algebra and integral tests
        run: |
          set -o pipefail
          python -m unittest discover -s research/major1-higgs-scalar-mixing-20261109 \
            -p "test_independent_*.py" -v 2>&1 | tee research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_tests.txt

      - name: Recompute the full fermion-sector matrix independently
        run: |
          python research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.py \
            --reference-json research/major1-higgs-scalar-mixing-20261109/fermion_sector_matrix_audit.json \
            --output research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.json

      - name: Hash independent validation records
        run: |
          sha256sum \
            research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.py \
            research/major1-higgs-scalar-mixing-20261109/test_independent_fermion_sector_matrix_audit.py \
            research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.json \
            research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_tests.txt \
            > research/major1-higgs-scalar-mixing-20261109/INDEPENDENT_FERMION_AUDIT_SHA256SUMS.txt

      - name: Commit independent numerical validation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_matrix_audit.json \
            research/major1-higgs-scalar-mixing-20261109/independent_fermion_sector_tests.txt \
            research/major1-higgs-scalar-mixing-20261109/INDEPENDENT_FERMION_AUDIT_SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No independent fermion audit output changes."
            exit 0
          fi
          git commit -m "Archive independent fermion matrix validation [audit-output]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
