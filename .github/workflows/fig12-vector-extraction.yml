name: Fig. 12 native-vector extraction and cross-check

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/extract_esseili_kribs_fig12_vector.py"
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_esseili_kribs_fig12_crosscheck.py"
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/B16_P1IIID_FIG12_VECTOR_EXTRACTION_CROSSCHECK_2026-11-11.md"
      - ".github/workflows/fig12-vector-extraction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check pymupdf numpy

      - name: Download and verify the APS published PDF
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-delay 2 \
            "https://journals.aps.org/prd/pdf/10.1103/718s-7k7v" \
            --output aps_fig12_source.pdf
          echo "d660eb390271b41c5c0c20ccd52cc57df891a78d30067a78f84bb6c228225a92  aps_fig12_source.pdf" \
            | sha256sum --check -

      - name: Extract native vector paths and perform profile cross-checks
        run: |
          set -euo pipefail
          python extract_esseili_kribs_fig12_vector.py aps_fig12_source.pdf --outdir outputs
          python audit_esseili_kribs_fig12_crosscheck.py --root . --outdir outputs
          rm aps_fig12_source.pdf

      - name: Commit reproducible vector and cross-check products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/esseili_kribs_fig12_*
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "Archive native-vector Fig. 12 extraction and profile cross-check"
          git push origin research/moving-muon-thermal-rates-20261107
