name: Fig. 12 native-vector extraction and cross-check

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/extract_esseili_kribs_fig12_vector.py"
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_esseili_kribs_fig12_crosscheck.py"
      - "research/stellar-cooling-constraints-20261105/blinov_reproduction/B16_P1IIID_FIG12_VECTOR_EXTRACTION_CROSSCHECK_2026-11-11.md"
      - ".github/workflows/fig12-vector-extraction.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check pymupdf numpy

      - name: Download and verify the SCOAP3 open-access copy of the APS published PDF
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-delay 2 -H "User-Agent: axial-vector-review-response/1.0" \
            "https://scoap3-prod-backend.s3.cern.ch/media/harvested_files/10.1103/718s-7k7v/718s-7k7v.pdf" \
            --output aps_fig12_source.pdf
          sha256sum aps_fig12_source.pdf
          python - <<'PY'
          import fitz, hashlib
          p = "aps_fig12_source.pdf"
          doc = fitz.open(p)
          page = doc[14]
          print("pages", len(doc), "page15_drawings", len(page.get_drawings()))
          targets = {
              "T": (1.0, 0.5097887, 0.0196078),
              "n": (0.0, 0.5097887, 0.7842985),
              "p": (0.2, 0.7293965, 1.0),
          }
          for name, color in targets.items():
              found = []
              for i, d in enumerate(page.get_drawings()):
                  c = d.get("color")
                  if c and max(abs(a-b) for a,b in zip(c,color)) < 0.003:
                      r = d["rect"]
                      found.append((i, tuple(round(v,3) for v in (r.x0,r.y0,r.x1,r.y1)), d["width"], len(d["items"])))
              print(name, found)
          PY
          echo "SCOAP3 inspection complete; extraction is intentionally paused until its digest/path inventory is pinned."
          exit 0

      - name: Extract native vector paths and perform profile cross-checks
        run: |
          set -euo pipefail
          python extract_esseili_kribs_fig12_vector.py aps_fig12_source.pdf --outdir outputs
          python audit_esseili_kribs_fig12_crosscheck.py --root . --outdir outputs
          rm aps_fig12_source.pdf

      - name: Commit reproducible vector and cross-check products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/esseili_kribs_fig12_*
          if git diff --cached --quiet; then
            echo "No generated output changes."
            exit 0
          fi
          git commit -m "Archive native-vector Fig. 12 extraction and profile cross-check"
          git push origin research/moving-muon-thermal-rates-20261107
