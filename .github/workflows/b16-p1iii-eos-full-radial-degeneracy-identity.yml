name: P1-IIIe-C3A full-radial degeneracy identity

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-p1iii-eos-full-radial-degeneracy-identity.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_nucleon_distribution.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_full_radial_occupation.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_full_radial_degeneracy_identity.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_full_radial_degeneracy_identity.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_degeneracy_identity_2026-11-11.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_degeneracy_identity_2026-11-11.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1iii-eos-full-radial-degeneracy-identity
  cancel-in-progress: false

jobs:
  full-radial-degeneracy-identity:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run C3-A unit tests over the full profile
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: python -m unittest test_b16_p1iii_eos_full_radial_degeneracy_identity -v

      - name: Recompute C3-A at all 301 radii
        env:
          C3_JSON: ${{ runner.temp }}/c3a.json
          C3_CSV: ${{ runner.temp }}/c3a.csv
        run: |
          set -euo pipefail
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_full_radial_degeneracy_identity.py --profile research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv --c2-reference research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv --output-json "$C3_JSON" --output-csv "$C3_CSV"

      - name: Compare independent Python reconstruction with committed C3-A results
        env:
          C3_JSON: ${{ runner.temp }}/c3a.json
          C3_CSV: ${{ runner.temp }}/c3a.csv
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path

          root = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs")
          expected = json.loads((root / "p1iii_eos_full_radial_degeneracy_identity_2026-11-11.json").read_text())
          actual = json.loads(Path(os.environ["C3_JSON"]).read_text())
          assert expected["overall_pass"] and actual["overall_pass"]
          assert all(actual["acceptance"].values())
          for species in ("n", "p"):
              for a, b in zip(expected["species"][species]["Fdeg_range"], actual["species"][species]["Fdeg_range"]):
                  assert math.isclose(a, b, rel_tol=1e-12, abs_tol=1e-12)
              assert actual["species"][species]["max_abs_relative_difference"] < 1e-8
              assert actual["species"][species]["max_abs_direct_vs_C2_reference"] < 5e-12

          expected_path = root / "p1iii_eos_full_radial_degeneracy_identity_2026-11-11.csv"
          c2_path = root / "p1iii_eos_full_radial_occupation_2026-11-11.csv"
          with expected_path.open(newline="") as stream:
              expected_rows = list(csv.DictReader(stream))
          with Path(os.environ["C3_CSV"]).open(newline="") as stream:
              actual_rows = list(csv.DictReader(stream))
          with c2_path.open(newline="") as stream:
              c2_rows = list(csv.DictReader(stream))
          assert len(expected_rows) == len(actual_rows) == len(c2_rows) == 301
          for expected_row, actual_row, c2_row in zip(expected_rows, actual_rows, c2_rows):
              assert abs(float(expected_row["r_km"])-float(actual_row["r_km"])) < 1e-12
              for key in ("Fnn_direct", "Fpp_direct"):
                  assert abs(float(expected_row[key])-float(actual_row[key])) < 1e-11, key
              for species, direct_key, derivative_key, ref_key in (
                  ("n", "Fnn_direct", "Fnn_density_derivative", "Fnn_deg"),
                  ("p", "Fpp_direct", "Fpp_density_derivative", "Fpp_deg"),
              ):
                  direct = float(actual_row[direct_key])
                  derivative = float(actual_row[derivative_key])
                  c2_value = float(c2_row[ref_key])
                  assert abs(direct-c2_value) < 5e-12, (species, actual_row["r_km"])
                  assert abs((derivative-direct)/direct) < 1e-8, (species, actual_row["r_km"])
          print("C3-A independent Python reconstruction validates all 301 radii and both derivative identities.")
          PY
