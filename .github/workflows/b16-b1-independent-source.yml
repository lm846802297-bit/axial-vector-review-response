name: Independent B.1 thin-source integration

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-b1-independent-source.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-b1-independent-source
  cancel-in-progress: false

jobs:
  independent-b1:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run independent B.1 quadrature unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_b1_independent.py' -v

      - name: Run independent B.1 thin-source integral
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py \
            --mass 10 --radius 25 --radial-order 4 --energy-order 4 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-09.json

      - name: Validate closure and convergence structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-09.json")
          d = json.loads(p.read_text())
          assert d["profile"]["sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert len(d["radial_convergence"]) == 3
          assert len(d["energy_convergence"]) == 4
          assert len(d["high_energy_tail_convergence"]) == 4
          assert abs(d["closure"]["sum_of_channels_relative_difference"]) < 1e-12
          assert d["closure"]["dimuon_channel_expected_closed_for_10MeV"] is True
          assert abs(d["closure"]["dimuon_channel_value"]) < 1e-100
          assert d["production_axial_outputs_modified"] is False
          print(json.dumps({
              "radial": d["radial_convergence"],
              "energy": d["energy_convergence"],
              "tail": d["high_energy_tail_convergence"],
              "final": d["comparison_with_archived_b16_b1"],
          }, indent=2))
          PY

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Archive machine-readable independent B.1 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Independent B.1 result is already current."
          else
            git commit -m "Archive independent B1 thin-source integration"
            for attempt in 1 2 3 4 5; do
              git fetch origin research/moving-muon-thermal-rates-20261107
              git rebase origin/research/moving-muon-thermal-rates-20261107
              if git push origin HEAD:research/moving-muon-thermal-rates-20261107; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry $attempt/5."
              sleep 2
            done
            echo "Could not archive independent B.1 result after five retries."
            exit 1
          fi
