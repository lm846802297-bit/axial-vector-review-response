name: B.16 energy-grid identity diagnostic

on:
  push:
    branches:
      - research/b16-energy-grid-diagnostic-20261117
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_b16_energy_grid_identity.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_energy_grid_identity.py'
      - '.github/workflows/b16-energy-grid-identity-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b16-energy-grid-identity-diagnostic-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the previously observed numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.4 scipy==1.18.1
      - name: Record exact runtime
        run: |
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
          git rev-parse HEAD
      - name: Run diagnostic unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_energy_grid_identity.py' -v
      - name: Reconstruct and compare B.16 energy grids
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_b16_energy_grid_identity.py \
            --mass 10 --nr 200 --opacity-order 640 --ne 200 \
            --energy-offset 1000 --strict-baseline \
            --output /tmp/b16_energy_grid_identity_diagnostic.json
      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b16-energy-grid-identity-diagnostic
          path: /tmp/b16_energy_grid_identity_diagnostic.json
          if-no-files-found: error
