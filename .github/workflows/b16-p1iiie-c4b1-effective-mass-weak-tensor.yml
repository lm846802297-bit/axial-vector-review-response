name: P1-IIIe-C4B1 effective-mass weak tensor

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-p1iiie-c4b1-effective-mass-weak-tensor.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_b_stationary_dirac_trace.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_full_radial_occupation.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4b1_effective_mass_weak_tensor.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_c4b1_effective_mass_weak_tensor.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1iiie-c4b1-effective-mass-weak-tensor
  cancel-in-progress: false

jobs:
  effective-mass-weak-tensor:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run C4-B1 unit tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: python -m unittest test_b16_p1iii_eos_c4b1_effective_mass_weak_tensor -v

      - name: Recompute effective-mass Ward and tensor checks
        env:
          C4B1_DIR: ${{ runner.temp }}/c4b1
        run: |
          set -euo pipefail
          mkdir -p "$C4B1_DIR"
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4b1_effective_mass_weak_tensor.py --profile research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv --output-json "$C4B1_DIR/summary.json" --output-ward-csv "$C4B1_DIR/ward.csv" --output-recovery-csv "$C4B1_DIR/vacuum_mass_recovery.csv"

      - name: Validate C4-B1 numerical acceptance
        env:
          C4B1_DIR: ${{ runner.temp }}/c4b1
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["C4B1_DIR"])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["overall_pass"]
          assert all(summary["acceptance"].values())
          assert summary["provenance"]["ward_scan_cases"] == 288
          assert summary["provenance"]["vacuum_mass_recovery_cases"] == 40
          assert summary["provenance"]["VA_sign_cases"] == 8
          assert summary["maxima"]["vector_ward_residual"] < 1e-10
          assert summary["maxima"]["mstar_equals_M_component_recovery_residual"] < 1e-12
          assert (root / "ward.csv").stat().st_size > 1000
          assert (root / "vacuum_mass_recovery.csv").stat().st_size > 1000
          print(json.dumps(summary["maxima"], indent=2))
          PY

      - name: Upload C4-B1 numerical outputs
        uses: actions/upload-artifact@v4
        with:
          name: c4b1-effective-mass-weak-tensor
          path: ${{ runner.temp }}/c4b1/
          if-no-files-found: error
          retention-days: 90
