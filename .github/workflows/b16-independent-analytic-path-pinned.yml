name: Independent analytic B.2 path integration pinned NumPy reproduction

on:
  push:
    branches:
      - maintenance/repository-organization-audit-20261114
    paths:
      - '.github/workflows/b16-independent-analytic-path-pinned.yml'
      - 'research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-independent-analytic-path-pinned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-independent-path:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4

      - name: Require the reviewed maintenance branch
        run: |
          test "$GITHUB_REF" = "refs/heads/maintenance/repository-organization-audit-20261114"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt

      - name: Verify exact runtime
        run: |
          python - <<'PY'
          import sys, numpy, scipy
          assert sys.version_info[:3] == (3, 12, 14)
          assert numpy.__version__ == "2.5.4"
          assert scipy.__version__ == "1.18.1"
          print("Python:", sys.version)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          PY
          python -m pip freeze

      - name: Run independent analytic B.2 path unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_path_independent.py' -v

      - name: Recompute the complete independent B.2 path integration
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py \
            --mass 10 --nr 40 --ne 100 --radius 25 --energy-offset 1000 \
            --angular-orders 16,32,64 \
            --simpson-subintervals 128,256 \
            --path-orders 8,16,32,64,128 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json

      - name: Verify strict provenance and integration closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json")
          payload = json.loads(path.read_text())
          import re
          assert payload.get("run_commit_sha")
          code_sha = payload.get("code_sha256")
          assert isinstance(code_sha, str) and re.fullmatch(r"[0-9a-f]{64}", code_sha)
          assert payload.get("profile", {}).get("sha256") == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert re.fullmatch(r"[0-9a-f]{64}", payload.get("fig7_reference_sha256", ""))
          assert re.fullmatch(r"[0-9a-f]{64}", payload.get("archived_b16_baseline_sha256", ""))
          config = payload["configuration"]
          assert config["mass_MeV"] == 10.0
          assert config["radial_order"] == 40 and config["energy_order_before_lapse_threshold_union"] == 100
          assert config["radius_km"] == 25.0
          baseline = payload["same_grid_baseline_reproduction"]
          assert baseline["maximum_absolute_relative_difference_vs_archived"] < 2.0e-9
          analytic = payload["analytic_path_vs_reference_path_quadrature"]
          assert analytic["same_16_gauss_directions"] is True
          assert analytic["maximum_luminosity_shift_vs_reference"] < 1.0e-3
          assert len(payload["independent_angular_convergence"]) == 5
          adaptive = payload["adaptive_quadpack_angular_checks"]
          assert adaptive["number_of_checks"] == 27
          assert adaptive["maximum_absolute_relative_difference_vs_simpson"] < 2.0e-6
          final = payload["final_independent_result"]
          assert final["curve_metrics_vs_fig7"]["n_points"] == 25
          assert final["maximum_absolute_luminosity_shift_vs_archived"] < 1.0e-3
          assert payload["production_axial_outputs_modified"] is False
          print("Pinned full analytic B.2 output provenance and numerical closure: OK")
          PY

      - name: Save pinned analytic-path output to the reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "results(b16): archive pinned analytic B2 path reproduction"
            git push origin HEAD:maintenance/repository-organization-audit-20261114
          fi
