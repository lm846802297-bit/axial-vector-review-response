name: Croon C1 10 MeV adaptive energy-order convergence

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-c1-10mev-adaptive-energy-convergence.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_croon_c1_10mev_adaptive_energy_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_c1_b13_vector_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/adaptive_radial_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/archive_croon_c1_10mev.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_2026-11-20.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-adaptive-energy-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      C1_RUNNER_LABEL: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision and reviewed profile identity
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies and result validator
        run: |
          python -m pip install numpy==2.5.5 scipy==1.18.1
          python -m pip install -r docs/repository-management/schemas/requirements-result-validation.txt
      - name: Run C1 and adaptive radial regression tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python -m unittest -v test_croon_c1_b13_vector_transport.py
          python -m unittest -v test_archive_croon_c1_10mev.py
      - name: Capture independent verification start time
        run: |
          echo "C1_EXECUTION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "C1_EXECUTION_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compute independent 153-node energy-48 adaptive transport
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python audit_croon_c1_10mev_adaptive_energy_convergence.py
      - name: Validate adaptive energy convergence and native outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("outputs")
          summary = json.loads((root / "C1_RNU_10MEV_ADAPTIVE_ENERGY_CONVERGENCE_2026-11-20.json").read_text())
          assert summary["status"] == "PASS", summary
          assert summary["maximum_over_all_reported_metrics"] < 1e-4
          assert summary["refined"]["radial_points"] == 153
          assert summary["refined"]["energy_order"] == 48
          assert summary["fixed_parameters"]["adaptive_radial"] is True
          assert summary["fixed_parameters"]["coupling_count"] == 121
          assert summary["fixed_parameters"]["polarizations"] == ["L", "+", "-"]
          assert summary["max_quadpack_relative_error_estimate"] < 1e-6
          assert summary["max_mode_sum_relative_residual"] < 1e-12
          assert summary["detailed_balance"]["max_B7_mode_residual"] < 1e-10
          assert summary["detailed_balance"]["max_B13_charge_mode_residual"] < 1e-10
          assert summary["detailed_balance"]["max_final_muon_shell_relative_error"] < 2e-10
          jp = Path(summary["refined"]["json_path"])
          cp = Path(summary["refined"]["csv_path"])
          data = json.loads(jp.read_text())
          item = data["masses"]["10"]
          assert item["radial_points"] == 153
          assert item["energy_points"] == 48
          assert item["polarization_modes"] == ["L", "+", "-"]
          assert len(item["coupling_curve"]) == 121
          assert len(item["local_profile"]) == 153
          for row in item["coupling_curve"]:
              for label in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                  total = row[label + "_adaptive_quad"]
                  modes = row[label + "_adaptive_quad_by_mode_erg_s"]
                  assert set(modes) == {"L", "+", "-"}
                  assert all(math.isfinite(v) and v >= 0 for v in modes.values())
                  assert abs(sum(modes.values())-total)/max(abs(total),1e-300) < 1e-12
          with cp.open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 153
          assert all(math.isfinite(float(row["r_km"])) for row in rows)
          print("C1 adaptive 32-to-48 energy-order convergence: PASS")
          print("maximum reported relative metric:", summary["maximum_over_all_reported_metrics"])
          print("QUADPACK maximum error estimate:", summary["max_quadpack_relative_error_estimate"])
          print("three-mode closure:", summary["max_mode_sum_relative_residual"])
          PY
      - name: Create SHA-256 manifest for adaptive energy outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.json \
            outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.csv \
            outputs/C1_RNU_10MEV_ADAPTIVE_ENERGY_CONVERGENCE_2026-11-20.json \
            > outputs/SHA256SUMS_croon_c1_adaptive_energy_convergence_2026-11-20.txt
      - name: Capture independent verification run metadata
        run: |
          finish_epoch=$(date +%s)
          echo "C1_EXECUTION_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "C1_EXECUTION_WALL_TIME_S=$((finish_epoch - C1_EXECUTION_START_EPOCH))" >> "$GITHUB_ENV"
          echo "C1_RUN_ID=C1-10MeV-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "C1_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "C1_SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "C1_WORKFLOW_RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "C1_NATIVE_OUTPUT_COMMIT=" >> "$GITHUB_ENV"
      - name: Generate and validate structured independent result package
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/archive_croon_c1_10mev.py \
            --output-dir "results/${C1_RUN_ID}"
          python docs/repository-management/schemas/validate_result_records.py --repo-root . \
            "results/${C1_RUN_ID}/run_manifest.json" \
            "results/${C1_RUN_ID}/result_summary.json" \
            "results/${C1_RUN_ID}/validation_report.json"
      - name: Commit independent outputs and structured archive to research branch
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/C1_RNU_10MEV_ADAPTIVE_ENERGY_CONVERGENCE_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_adaptive_energy_convergence_2026-11-20.txt
          git add "results/${C1_RUN_ID}"
          if ! git diff --cached --quiet; then
            git commit -m "Archive C1 adaptive energy-order convergence"
            for attempt in 1 2 3; do
              git fetch origin "$BRANCH"
              if ! git rebase "origin/$BRANCH"; then git rebase --abort || true; continue; fi
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
            done
            exit 1
          fi

      - name: Finalize and revalidate committed independent archive
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/archive_croon_c1_10mev.py \
            --output-dir "results/${C1_RUN_ID}" \
            --finalize \
            --pr-url https://github.com/lm846802297-bit/axial-vector-review-response/pull/123
          python docs/repository-management/schemas/validate_result_records.py --repo-root . \
            "results/${C1_RUN_ID}/run_manifest.json" \
            "results/${C1_RUN_ID}/result_summary.json" \
            "results/${C1_RUN_ID}/validation_report.json"
      - name: Commit final archive status
        env:
          BRANCH: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git add "results/${C1_RUN_ID}/run_manifest.json"
          git commit -m "Mark C1 structured result archive committed to PR branch"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true
              continue
            fi
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          exit 1
      - name: Upload independent outputs and validated structured archive
        uses: actions/upload-artifact@v4
        with:
          name: c1-10mev-independent-result-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_energy48_2026-11-20.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/C1_RNU_10MEV_ADAPTIVE_ENERGY_CONVERGENCE_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_adaptive_energy_convergence_2026-11-20.txt
            results/${{ env.C1_RUN_ID }}/
          if-no-files-found: error
