name: Bollig original-source outer thermodynamic profile audit

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_bollig_outer_thermodynamic_profile.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - '.github/workflows/bollig-outer-thermodynamic-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bollig-outer-thermodynamic-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and PDF dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pymupdf
      - name: Compare original Bollig curves without extrapolation
        run: python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_bollig_outer_thermodynamic_profile.py
      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- research/stellar-cooling-constraints-20261105/rates.py research/stellar-cooling-constraints-20261105/transport.py research/stellar-cooling-constraints-20261105/outputs/axial.json research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive audit data and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_outer_thermodynamic_profile_15_22km_2026-11-09.json
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/BOLLIG_OUTER_THERMODYNAMIC_PROFILE_15_22KM_2026-11-09.md
          if git diff --cached --quiet; then
            echo "Outer thermodynamic profile audit is already current."
          else
            git commit -m "Archive Bollig outer thermodynamic profile audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry ${attempt}/5."
              sleep 2
            done
            echo "Could not archive Bollig outer profile audit after five retries."
            exit 1
          fi
