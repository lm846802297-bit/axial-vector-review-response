name: Croon C1 10 MeV grid convergence audit

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-c1-10mev-grid-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-10mev-grid-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision and profile identity
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run C1 mode-resolved regression tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_croon_c1_b13_vector_transport.py
      - name: Compute independent radial, energy, combined, and B.7 angular refinements
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python audit_croon_c1_10mev_grid_convergence.py
      - name: Validate convergence summary and native output files
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          root = Path("outputs")
          summary = json.loads((root / "croon_c1_10mev_grid_convergence_summary_2026-11-20.json").read_text())
          assert len(summary["configurations"]) == 4
          assert summary["baseline"]["radial_points"] == 103
          assert summary["baseline"]["energy_points"] == 32
          assert summary["baseline"]["coupling_points"] == 121
          for result in summary["configurations"]:
              jp = Path(result["json_path"])
              cp = Path(result["csv_path"])
              data = json.loads(jp.read_text())
              item = data["masses"]["10"]
              assert item["polarization_modes"] == ["L", "+", "-"]
              assert len(item["coupling_curve"]) == 121
              assert item["radial_points"] >= result["configuration"]["radial_points"]
              assert item["energy_points"] == result["configuration"]["energy_order"]
              assert item["maximum_B7_mode_detailed_balance_residual"] < 1e-10
              assert item["maximum_B13_charge_mode_detailed_balance_residual"] < 1e-10
              assert item["maximum_final_muon_shell_relative_error"] < 2e-10
              assert max(item["thin_source_mode_sum_relative_residuals"].values()) < 1e-12
              for row in item["coupling_curve"]:
                  for label in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                      modes = row[label + "_by_mode_erg_s"]
                      assert set(modes) == {"L", "+", "-"}
                      residual = abs(sum(modes.values()) - row[label]) / max(abs(row[label]), 1e-300)
                      assert residual < 1e-12
              with cp.open(newline="") as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) == item["radial_points"]
              assert all(math.isfinite(float(row["r_km"])) for row in rows)
          print("All four grid outputs are structurally valid and mode-closed.")
          print("Overall convergence status:", summary["overall_status"])
          for result in summary["configurations"]:
              print(result["configuration"]["name"], result["maximum_curve_or_source_change"], result["status"])
          PY
      - name: Create SHA-256 manifest for all grid outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_c1_10mev_grid_*.json \
            outputs/croon_c1_10mev_grid_*.csv \
            > outputs/SHA256SUMS_croon_c1_10mev_grid_convergence_2026-11-20.txt
      - name: Upload native convergence outputs before Git archival
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-10mev-grid-convergence-2026-11-20
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_10mev_grid_*.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_10mev_grid_*.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_grid_convergence_2026-11-20.txt
          if-no-files-found: error
      - name: Commit native grid-convergence results to the research branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_10mev_grid_*.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_10mev_grid_*.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_grid_convergence_2026-11-20.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive C1 10 MeV radial-energy-angular convergence"
            for attempt in 1 2 3; do
              git fetch origin "research/croon-vector-benchmark-and-rate-corrections-20261119"
              git rebase "origin/research/croon-vector-benchmark-and-rate-corrections-20261119"
              if git push origin "HEAD:research/croon-vector-benchmark-and-rate-corrections-20261119"; then
                exit 0
              fi
            done
            exit 1
          fi
