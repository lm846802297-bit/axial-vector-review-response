name: B16 high-energy strict NumPy reproduction

on:
  push:
    branches:
      - maintenance/repository-organization-audit-20261114
    paths:
      - '.github/workflows/b16-high-energy-strict-numpy-reproduction.yml'
      - 'research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_channel_resolved_energy.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_high_energy_nu_chord_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_high_order_independent_grid_10mev_2026-11-09.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-high-energy-strict-numpy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-numpy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt

      - name: Verify exact runtime
        run: |
          python - <<'PY'
          import sys, numpy, scipy
          assert sys.version_info[:3] == (3, 12, 14)
          assert numpy.__version__ == "2.5.4"
          assert scipy.__version__ == "1.18.1"
          print("Python:", sys.version)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          PY
          python -m pip freeze

      - name: Run complete channel-resolved B.1+B.2 NumPy calculation
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_channel_resolved_energy.py \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_channel_resolved_energy_10mev_2026-11-15_numpy.json

      - name: Run 36-ray high-energy neutrino chord convergence in NumPy
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_high_energy_nu_chord_convergence.py \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_high_energy_nu_chord_convergence_10mev_2026-11-15_numpy.json

      - name: Verify provenance and output completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs")
          for name in (
              "b16_channel_resolved_energy_10mev_2026-11-15_numpy.json",
              "b16_high_energy_nu_chord_convergence_10mev_2026-11-15_numpy.json",
          ):
              path = base / name
              payload = json.loads(path.read_text())
              assert payload.get("script_sha256"), name
              assert payload.get("run_commit_sha"), name
              result = payload["result"]
              assert result.get("execution"), name
              assert "Python/NumPy" in result["execution"].get("engine", ""), name
              assert result["execution"].get("profile_sha256"), name
              assert result["execution"].get("fig7_sha256"), name
              print(name, "OK", result["execution"])
          PY

      - name: Save strict NumPy outputs to the reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_channel_resolved_energy_10mev_2026-11-15_numpy.json
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_high_energy_nu_chord_convergence_10mev_2026-11-15_numpy.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "results(b16): archive strict NumPy high-energy reproductions"
            git push origin HEAD:maintenance/repository-organization-audit-20261114
          fi
