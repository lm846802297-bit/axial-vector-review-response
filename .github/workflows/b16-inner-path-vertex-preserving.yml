name: B.16 inner-path audit on vertex-preserving profile

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-inner-path-vertex-preserving.yml'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_inner_path_channel_directional.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_inner_path_channel_directional.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-inner-path-vertex-preserving-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run analytic path integration tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_inner_path_channel_directional.py' -v
      - name: Run full channel x shell x direction audit on current profile
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_inner_path_channel_directional.py \
            --mass 10 --nr 40 --ne 100 --na 32 \
            --legacy-path-order 32 --direct-path-order 256 \
            --energy-offset 1000 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_inner_path_channel_directional_vertex_preserving_10mev_2026-11-09.json
      - name: Verify the current vertex-preserving profile was used
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_inner_path_channel_directional_vertex_preserving_10mev_2026-11-09.json")
          d = json.loads(p.read_text())
          expected = "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          actual = d["provenance"]["profile_sha256"]
          if actual != expected:
              raise SystemExit(f"Unexpected profile SHA: {actual}")
          print(f"Confirmed vertex-preserving profile SHA-256: {actual}")
          PY
      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive machine-readable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_inner_path_channel_directional_vertex_preserving_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Vertex-preserving inner-path output is already current."
          else
            git commit -m "Archive B.16 inner-path audit on vertex-preserving profile"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive the vertex-preserving inner-path audit after five retries."
            exit 1
          fi
