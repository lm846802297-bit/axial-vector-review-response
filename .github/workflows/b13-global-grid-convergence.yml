name: B.13 global radial and energy grid convergence

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b13-global-grid-convergence.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_grid_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_summary_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b13-global-grid-convergence-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  convergence:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Compile convergence scan
        run: |
          python -m py_compile \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_grid_convergence.py \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py
      - name: Run radial and energy convergence scan
        env:
          PYTHONPATH: \${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_grid_convergence.py \
            --mass 10 \
            --na 16 \
            --ns 32 \
            --energy-offset 1000 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_grid_convergence_2026-11-09.json
      - name: Verify convergence output and production isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_grid_convergence_2026-11-09.json")
          d = json.loads(p.read_text())
          if d["profile_sha256"] != "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c":
              raise SystemExit("Unexpected profile fingerprint")
          if len(d["grid_results"]) != 3:
              raise SystemExit("Expected three convergence configurations")
          print(json.dumps(d["convergence_criterion"], indent=2))
          PY
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive convergence summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_grid_convergence_2026-11-09.json
          if git diff --cached --quiet; then
            echo "B.13 convergence summary is already current."
          else
            git commit -m "Archive B.13 global radial and energy convergence scan"
            for attempt in 1 2 3 4 5; do
              git fetch origin "\${GITHUB_REF_NAME}"
              git rebase "origin/\${GITHUB_REF_NAME}"
              if git push origin "HEAD:\${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive B.13 convergence summary after five retries."
            exit 1
          fi
