name: B.16 10 MeV local-rate polarization sample package

on:
  push:
    branches:
      - maintenance/close-baseline-revision-required-20261117
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_local_rate_polarization_samples.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_local_rate_polarization_samples.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_local_absorption.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/data/profile_provenance.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_absorption_vertex_preserving_10mev_2026-11-09.json'
      - '.github/workflows/b16-local-rate-polarization-samples.yml'

permissions:
  contents: write

concurrency:
  group: b16-local-rate-polarization-samples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    if: github.ref_name == 'maintenance/close-baseline-revision-required-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.4 scipy==1.18.1
      - name: Run local-rate polarization tests
        run: |
          python -m unittest discover -s research/stellar-cooling-constraints-20261105/blinov_reproduction -p 'test_b16_local_rate_polarization_samples.py' -v
      - name: Generate CSV, JSON and SVG handoff
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_local_rate_polarization_samples.py --output-dir research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs
      - name: Validate generated package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_rate_polarization_samples_10mev_54pt.json")
          d = json.loads(p.read_text())
          assert d["configuration"]["point_count"] == 54
          assert d["benchmark"]["profile_sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert max(d["closure_maxima"].values()) < 1e-12
          assert d["outputs"]["csv"]["bytes"] > 0
          assert d["outputs"]["svg"]["bytes"] > 0
          print(json.dumps({
              "profile_sha256": d["benchmark"]["profile_sha256"],
              "profile_git_blob_sha1": d["benchmark"]["profile_git_blob_sha1"],
              "point_count": d["configuration"]["point_count"],
              "closure_maxima": d["closure_maxima"],
              "outputs": d["outputs"],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit generated handoff package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_rate_polarization_samples_10mev_54pt.csv research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_rate_polarization_samples_10mev_54pt.json research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_rate_polarization_samples_10mev_54pt.svg
          if git diff --cached --quiet; then
            echo "The generated local-rate package is already current."
            exit 0
          fi
          git commit -m "Archive 10 MeV local-rate polarization sample package"
          git push origin "HEAD:${GITHUB_REF_NAME}"
