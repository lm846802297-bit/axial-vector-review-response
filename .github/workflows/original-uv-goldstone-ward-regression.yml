name: Original UV axial Goldstone Ward regression

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/original-uv-goldstone-ward-regression.yml'
      - 'research/stellar-cooling-original-uv-model-20261105/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-uv-goldstone-ward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Run single-VEV map and axial Goldstone Ward tests
        working-directory: research/stellar-cooling-original-uv-model-20261105
        run: |
          python -m unittest -v \
            test_axial_goldstone_ward_identity.py \
            test_single_vev_axial_mapping.py
      - name: Run original UV exact semi-Compton matrix-element checks
        run: |
          python research/stellar-cooling-original-uv-model-20261105/stellar_semi_compton_axial_matrix_element.py --check
