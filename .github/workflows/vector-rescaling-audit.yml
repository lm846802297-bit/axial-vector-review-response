name: Vector coupling rescaling audit

on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/rescaling_audit/**'
      - '.github/workflows/vector-rescaling-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vector-rescaling-audit-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Run rescaling regression tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/rescaling_audit \
            -p 'test_*.py' -v

      - name: Generate post-processing audit
        run: |
          python research/stellar-cooling-constraints-20261105/rescaling_audit/run.py \
            --output research/stellar-cooling-constraints-20261105/rescaling_audit/outputs/rescaling_audit.json

      - name: Verify source scans and production files were not changed
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/blinov_literal_scan.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig4_fig7_comparison.json \
            research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json

      - name: Archive machine-readable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/rescaling_audit/outputs/rescaling_audit.json
          if git diff --cached --quiet; then
            echo "Rescaling audit output is already current."
          else
            git commit -m "Archive vector coupling rescaling audit"
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi
