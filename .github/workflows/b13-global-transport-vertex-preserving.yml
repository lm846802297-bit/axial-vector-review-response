name: Global B.13 exact Compton source-and-opacity transport audit

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b13-global-transport-vertex-preserving.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b13_global_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_redshift_audit_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_0p1mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_1mev_2026-11-09.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b13-global-transport-vertex-preserving-${{ github.ref }}
  cancel-in-progress: false

jobs:
  global-b13-transport:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Compile global B.13 diagnostic
        run: |
          python -m py_compile \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b13_global_transport.py
      - name: Run bookkeeping unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b13_global_transport.py' -v
      - name: Run full 0.1 MeV B.13 source-and-opacity replacement
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py \
            --baseline research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_redshift_audit_2026-11-09.json \
            --mass 0.1 --nr 40 --ne 100 --na 16 --ns 32 --energy-offset 1000 \
            --kernel-orders 12,8,8,8 --refined-orders 16,10,10,10 --active-threshold 1e-8 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_0p1mev_2026-11-09.json
      - name: Run full 1 MeV B.13 source-and-opacity replacement
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py \
            --baseline research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_redshift_audit_2026-11-09.json \
            --mass 1 --nr 40 --ne 100 --na 16 --ns 32 --energy-offset 1000 \
            --kernel-orders 12,8,8,8 --refined-orders 16,10,10,10 --active-threshold 1e-8 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_1mev_2026-11-09.json
      - name: Run full 10 MeV B.13 source-and-opacity replacement
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py \
            --mass 10 \
            --nr 40 \
            --ne 100 \
            --na 16 \
            --ns 32 \
            --energy-offset 1000 \
            --kernel-orders 12,8,8,8 \
            --refined-orders 16,10,10,10 \
            --active-threshold 1e-8 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_10mev_2026-11-09.json
      - name: Verify all masses, profile identity, and B.16 closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs")
          expected = "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          files = {
              0.1: root / "b13_global_transport_vertex_preserving_0p1mev_2026-11-09.json",
              1.0: root / "b13_global_transport_vertex_preserving_1mev_2026-11-09.json",
              10.0: root / "b13_global_transport_vertex_preserving_10mev_2026-11-09.json",
          }
          for mass, path in files.items():
              data = json.loads(path.read_text())
              if float(data["mass_MeV"]) != mass:
                  raise SystemExit(f"Wrong mass in {path}: {data['mass_MeV']}")
              if data["profile"]["sha256"] != expected:
                  raise SystemExit(f"Unexpected profile SHA in {path}: {data['profile']['sha256']}")
              residual = data["archived_B16_baseline"]["max_relative_reproduction_residual"]
              if residual > 2e-10:
                  raise SystemExit(f"B.16 baseline closure failed at {mass} MeV: {residual}")
              print(f"{mass:g} MeV: profile and B.16 closure verified; "
                    f"strong B.13 residual = "
                    f"{data['variant_results']['B13_mu_minus_consistent_source_and_opacity']['metrics_vs_fig7']['strong_endpoint_relative_difference']:+.6%}")
          PY
      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive machine-readable global B.13 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_0p1mev_2026-11-09.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_1mev_2026-11-09.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_vertex_preserving_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Global B.13 transport output is already current."
          else
            git commit -m "Archive global B.13 source and opacity transport audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive global B.13 transport output after five retries."
            exit 1
          fi
