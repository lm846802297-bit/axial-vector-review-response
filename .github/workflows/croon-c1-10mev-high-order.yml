name: Croon C1 10 MeV high-order vector transport

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-c1-10mev-high-order.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_c1_b13_vector_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_croon_c1_b13_vector_transport.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-10mev-high-order:
    if: github.ref == 'refs/heads/research/croon-vector-benchmark-and-rate-corrections-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision and runtime
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run C1 equation, detailed-balance, and boundary tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_croon_c1_b13_vector_transport.py
      - name: Compute 10 MeV high-order C1 vector transport
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python croon_c1_b13_vector_transport.py \
            --masses 10.0 \
            --radial-points 101 \
            --energy-order 48 \
            --inner-orders 16,10,10,10 \
            --neutrino-order 128 \
            --susceptibility-order 192 \
            --coupling-count 121 \
            --output outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.json \
            --csv outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.csv
      - name: Validate native output structure and numerical finiteness
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path
          p = Path("outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.json")
          data = json.loads(p.read_text())
          assert data["status"].startswith("C1 interior-profile")
          assert list(data["masses"]) == ["10"]
          item = data["masses"]["10"]
          assert len(item["coupling_curve"]) == 121
          assert len(item["local_profile"]) >= 101
          for key, value in item["thin_source_per_g2_erg_s"].items():
              assert math.isfinite(value) and value >= 0, (key, value)
          for row in item["coupling_curve"]:
              assert 0 < row["g_X"] <= 1
              for key in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                  assert math.isfinite(row[key]) and row[key] >= 0
          with Path("outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.csv").open() as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == len(item["local_profile"])
          print("JSON/CSV structure, coupling grid, and finite-value checks: PASS")
          print("radial rows:", len(rows), "coupling points:", len(item["coupling_curve"]))
          PY
      - name: Create SHA-256 manifest
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.json \
            outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.csv \
            > outputs/SHA256SUMS_croon_c1_10mev_high_order_2026-11-20.txt
      - name: Upload native results and manifest
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-10mev-high-order-2026-11-20
          retention-days: 14
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_high_order_2026-11-20.txt
          if-no-files-found: error
      - name: Commit native calculation results to the research branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_high_order_2026-11-20.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_10mev_high_order_2026-11-20.txt
          git commit -m "Archive high-order C1 10 MeV vector transport"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
