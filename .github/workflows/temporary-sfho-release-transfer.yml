name: Temporary SFHo manual transfer

on:
  push:
    branches:
      - transfer/sfho-frdm-release-transfer-20261111

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current PR manifest
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107

      - name: Download and verify original manual
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw
          gh release download sfho-frdm-v1.03-data \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'manual_v1.04.pdf' \
            --dir raw
          manifest='research/stellar-cooling-constraints-20261105/blinov_reproduction/sfho_frdm_v1.03_manifest.sha256'
          grep -E ' (manual_v1\.04\.pdf)$' "$manifest" \
            | (cd raw && sha256sum -c -)
          test "$(stat -c %s raw/manual_v1.04.pdf)" = 213440

      - name: Transfer verified manual
        uses: actions/upload-artifact@v4
        with:
          name: sfho-frdm-manual-20261111
          path: raw/manual_v1.04.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
