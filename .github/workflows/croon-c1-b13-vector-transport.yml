name: Croon C1 reduced-grid independent vector benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-reduced-grid-verification:
    if: github.ref == 'refs/heads/research/croon-vector-benchmark-and-rate-corrections-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record runtime and source revision
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
          sha256sum research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_c1_b13_vector_transport.py
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run C1 equation, detailed-balance, and boundary tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_croon_c1_b13_vector_transport.py
      - name: Compute one-mass reduced-grid verification
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python croon_c1_b13_vector_transport.py \
            --masses 10.0 \
            --radial-points 33 \
            --energy-order 24 \
            --inner-orders 8,6,6,6 \
            --neutrino-order 48 \
            --susceptibility-order 64 \
            --coupling-count 31 \
            --output "${RUNNER_TEMP}/croon_c1_reduced_grid_verification.json" \
            --csv "${RUNNER_TEMP}/croon_c1_reduced_grid_verification.csv"
      - name: Validate reduced-grid output
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "croon_c1_reduced_grid_verification.json").read_text())
          assert data["status"].startswith("C1 interior-profile")
          assert list(data["masses"]) == ["10"]
          item = data["masses"]["10"]
          assert len(item["coupling_curve"]) == 31
          assert len(item["local_profile"]) >= 33
          for row in item["coupling_curve"]:
              assert math.isfinite(row["g_X"]) and 0 < row["g_X"] <= 1
              for key in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                  assert math.isfinite(row[key]) and row[key] >= 0
          with (root / "croon_c1_reduced_grid_verification.csv").open() as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == len(item["local_profile"])
          print("Reduced-grid structure and finite-value checks: PASS")
          print("radial rows:", len(rows), "coupling points:", len(item["coupling_curve"]))
          PY
      - name: Create SHA-256 manifest
        run: |
          cd "${RUNNER_TEMP}"
          sha256sum croon_c1_reduced_grid_verification.json croon_c1_reduced_grid_verification.csv > SHA256SUMS.txt
      - name: Upload reduced-grid verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-reduced-grid-independent-verification
          retention-days: 14
          path: |
            ${{ runner.temp }}/croon_c1_reduced_grid_verification.json
            ${{ runner.temp }}/croon_c1_reduced_grid_verification.csv
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
