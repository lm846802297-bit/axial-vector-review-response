name: PR55 referee response LaTeX build

on:
  push:
    branches:
      - review/response-point-conclusions-20261106
    paths:
      - "Replies_to_Referee_3_referee_facing_2026-11-04.tex"
      - "Replies_to_Referee_3_neutrino_references.bib"
      - "overleaf-source/axial-vector-model-building-v6/references.bib"
      - "JHEP.bst"
      - ".github/workflows/pr55-latex-build.yml"

permissions:
  contents: write

concurrency:
  group: pr55-latex-build
  cancel-in-progress: false

jobs:
  compile-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR #55 branch
        uses: actions/checkout@v4
        with:
          ref: review/response-point-conclusions-20261106
          fetch-depth: 0

      - name: Install TeX Live and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-bibtex-extra \
            texlive-extra-utils \
            poppler-utils \
            ghostscript \
            python3-pil

      - name: Clean and compile with pdfLaTeX and BibTeX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pages
          export BIBINPUTS="$GITHUB_WORKSPACE/overleaf-source/axial-vector-model-building-v6:$GITHUB_WORKSPACE:"
          export BSTINPUTS="$GITHUB_WORKSPACE:"
          latexmk -C -outdir=build Replies_to_Referee_3_referee_facing_2026-11-04.tex
          latexmk -pdf -bibtex -interaction=nonstopmode -file-line-error -halt-on-error \
            -outdir=build Replies_to_Referee_3_referee_facing_2026-11-04.tex \
            2>&1 | tee build/latexmk.stdout.log
          test -s build/Replies_to_Referee_3_referee_facing_2026-11-04.pdf
          test -s build/Replies_to_Referee_3_referee_facing_2026-11-04.bbl
          cp build/Replies_to_Referee_3_referee_facing_2026-11-04.pdf \
            ./Replies_to_Referee_3_referee_facing_2026-11-04.pdf

      - name: Validate citations, references, and PDF text
        shell: bash
        run: |
          set -euo pipefail
          LOG=build/Replies_to_Referee_3_referee_facing_2026-11-04.log
          BLG=build/Replies_to_Referee_3_referee_facing_2026-11-04.blg
          if grep -Eiq 'Citation .* undefined|Reference .* undefined|There were undefined references' "$LOG"; then
            echo "Undefined citation/reference detected"
            grep -Ein 'Citation .* undefined|Reference .* undefined|There were undefined references' "$LOG"
            exit 1
          fi
          if grep -Eiq "I didn't find a database entry|Warning--I didn't find" "$BLG"; then
            echo "BibTeX reports a missing database entry"
            cat "$BLG"
            exit 1
          fi
          test "$(grep -c '\\bibitem' build/Replies_to_Referee_3_referee_facing_2026-11-04.bbl)" -gt 0
          pdftotext -layout Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/reply-extracted.txt
          test -s build/reply-extracted.txt
          if grep -Eq '\[\?\]|\?\?' build/reply-extracted.txt; then
            echo "Unresolved [ ? ] or ?? placeholder found in extracted PDF text"
            exit 1
          fi
          pdfinfo Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdfinfo.txt
          pdffonts Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdffonts.txt
          if ! awk 'NR > 2 && $4 != "yes" { bad=1 } END { exit bad }' build/pdffonts.txt; then
            echo "At least one PDF font is not embedded"
            exit 1
          fi
          sha256sum Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdf-sha256.txt
          grep -E 'Pages:|Page size:|File size:' build/pdfinfo.txt

      - name: Render all pages and prepare page-by-page visual review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/review-pages visual-review/pr55-2026-11-06
          pdftoppm -jpeg -r 90 -jpegopt quality=78 Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/review-pages/page
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          from PIL import Image, ImageDraw
          pages = sorted(Path("build/review-pages").glob("page-*.jpg"))
          if not pages:
              raise SystemExit("No PDF pages were rendered")
          metrics = []
          for i, page in enumerate(pages, start=1):
              image = Image.open(page).convert("RGB")
              width, height = image.size
              gray = image.convert("L")
              bbox = gray.point(lambda p: 255 if p < 245 else 0).getbbox()
              if bbox is None:
                  raise SystemExit(f"Blank page detected: {page.name}")
              left, top, right, bottom = bbox
              metrics.append({
                  "page": i, "render": page.name, "width": width, "height": height,
                  "content_bbox": [left, top, right, bottom],
                  "edge_clearance_px": [left, top, width-right, height-bottom]
              })
          review = Path("visual-review/pr55-2026-11-06")
          (review / "page-metrics.json").write_text(json.dumps(metrics, indent=2))
          # Store five full-page JPEGs per UTF-8 text file. This bypasses the
          # repository's exhausted Actions artifact quota while preserving
          # inspectable page images through the authenticated GitHub connector.
          for start in range(0, len(pages), 5):
              subset = pages[start:start+5]
              first, last = start+1, start+len(subset)
              target = review / f"pages-{first:02d}-{last:02d}.b64.txt"
              with target.open("w") as out:
                  for page in subset:
                      out.write(page.name + "|" + base64.b64encode(page.read_bytes()).decode("ascii") + "\n")
          # A quick overview montage accompanies the individual page images.
          for start in range(0, len(pages), 20):
              subset = pages[start:start+20]
              tiles = []
              for page in subset:
                  im = Image.open(page).convert("RGB")
                  im.thumbnail((300, 424))
                  tile = Image.new("RGB", (320, 450), "white")
                  tile.paste(im, ((320-im.width)//2, 20))
                  ImageDraw.Draw(tile).text((8, 3), page.stem, fill="black")
                  tiles.append(tile)
              cols = 4
              rows = (len(tiles)+cols-1)//cols
              sheet = Image.new("RGB", (cols*320, rows*450), (220,220,220))
              for i, tile in enumerate(tiles):
                  sheet.paste(tile, ((i%cols)*320, (i//cols)*450))
              (review / f"overview-{start+1:02d}-{start+len(subset):02d}.jpg").write_bytes(b"")
              sheet.save(review / f"overview-{start+1:02d}-{start+len(subset):02d}.jpg", quality=82)
          print(f"Rendered {len(pages)} pages; prepared {((len(pages)+4)//5)} page-image batches")
          PY

      - name: Commit the freshly compiled PDF to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Replies_to_Referee_3_referee_facing_2026-11-04.pdf visual-review/pr55-2026-11-06/
          if ! git diff --cached --quiet; then
            git commit -m "Publish PR55 PDF and temporary page-by-page review images [skip ci]"
            git push origin HEAD:review/response-point-conclusions-20261106
          else
            echo "Compiled PDF and page-review files are unchanged."
          fi
