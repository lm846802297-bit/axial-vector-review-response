name: Full independent B.1+B.2 luminosity integration

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-full-b1b2-independent.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1b2_full_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_b1b2_full_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-full-b1b2-independent
  cancel-in-progress: false

jobs:
  full-independent:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run full B.1+B.2 unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_b1b2_full_independent.py' -v

      - name: Run independent full B.1+B.2 luminosity integration
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1b2_full_independent.py \
            --mass 10 --radius 25 --radial-order 4 --energy-order 4 \
            --energy-panels 80 --energy-offset 2000 --angular-order 16 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_full_b1b2_independent_10mev_2026-11-09.json

      - name: Validate full luminosity and source closure
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_full_b1b2_independent_10mev_2026-11-09.json")
          d = json.loads(p.read_text())
          assert d["profile"]["sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert len(d["couplings"]) == 25
          assert len(d["final_200_node_result"]["luminosity_erg_s"]) == 25
          assert d["final_200_node_result"]["number_of_source_radial_nodes"] == 200
          assert d["final_200_node_result"]["energy_nodes_per_source_radius"] == 320
          assert abs(d["source_closure"]["relative_difference_vs_independent_b1_400_node"]) < 0.01
          assert abs(d["radial_convergence"]["maximum_absolute_luminosity_shift"]) < 0.01
          assert d["production_axial_outputs_modified"] is False
          def check_finite(value):
              if isinstance(value, float):
                  assert math.isfinite(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      check_finite(item)
              elif isinstance(value, list):
                  for item in value:
                      check_finite(item)
          check_finite(d)
          print(json.dumps({
              "source_closure": d["source_closure"],
              "radial_convergence": d["radial_convergence"],
              "final_vs_fig7": d["final_curve_metrics_vs_fig7"],
              "final_vs_archived_b16": d["final_curve_metrics_vs_archived_b16"],
          }, indent=2))
          PY

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Archive machine-readable full B.1+B.2 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_full_b1b2_independent_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Independent full B.1+B.2 result is already current."
          else
            git commit -m "Archive full independent B1 B2 luminosity integration"
            for attempt in 1 2 3 4 5; do
              git fetch origin research/moving-muon-thermal-rates-20261107
              git rebase origin/research/moving-muon-thermal-rates-20261107
              if git push origin HEAD:research/moving-muon-thermal-rates-20261107; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry $attempt/5."
              sleep 2
            done
            echo "Could not archive independent full B.1+B.2 result after five retries."
            exit 1
          fi
