name: Independent analytic B.2 path integration on vertex-preserving profile

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-path-independent-analytic.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-path-independent-analytic
  cancel-in-progress: false

jobs:
  independent-path:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run independent analytic-path unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_path_independent.py' -v

      - name: Recompute independent B.2 path integrals and angular averages
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py \
            --mass 10 --nr 40 --ne 100 --radius 25 --energy-offset 1000 \
            --angular-orders 16,32,64 \
            --simpson-subintervals 128,256 \
            --path-orders 8,16,32,64,128 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-09.json

      - name: Validate independent result and baseline closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-09.json")
          d = json.loads(p.read_text())
          assert d["profile"]["sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert d["same_grid_baseline_reproduction"]["maximum_absolute_relative_difference_vs_archived"] < 2e-9
          assert d["adaptive_quadpack_angular_checks"]["maximum_absolute_relative_difference_vs_simpson"] < 2e-5
          assert d["final_independent_result"]["maximum_absolute_luminosity_shift_vs_archived"] < 0.02
          assert d["production_axial_outputs_modified"] is False
          print(json.dumps({
              "baseline": d["same_grid_baseline_reproduction"],
              "path": d["analytic_path_vs_reference_path_quadrature"],
              "angular": d["independent_angular_convergence"],
              "quadpack": d["adaptive_quadpack_angular_checks"],
              "final": d["final_independent_result"]["curve_metrics_vs_fig7"],
          }, indent=2))
          PY

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Archive machine-readable independent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Independent analytic B.2 output is already current."
          else
            git commit -m "Archive independent analytic B2 path integration"
            for attempt in 1 2 3 4 5; do
              git fetch origin research/moving-muon-thermal-rates-20261107
              git rebase origin/research/moving-muon-thermal-rates-20261107
              if git push origin HEAD:research/moving-muon-thermal-rates-20261107; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry number $attempt of 5."
              sleep 2
            done
            echo "Could not archive independent B.2 output after five retries."
            exit 1
          fi
