name: C4-C4-B full-radial energy-dependent scattering

on:
  push:
    branches:
      - research/c4c4-energy-dependence-20261112
    paths:
      - .github/workflows/b16-p1iiie-c4c4b-full-radial-energy-dependence.yml
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c4_radial_energy_dependence.py
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_c4c4_radial_energy_dependence.py
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/c4c3_direct_local_recomputation_2026-11-11/local_independent_radial_rates_301x4.csv
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/c4c4_energy_dependence_2026-11-12/local_rates_96.csv
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c4c4-b-full-radial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy numba
      - name: Compile source and tests
        run: |
          python -m py_compile research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c4_radial_energy_dependence.py
          python -m py_compile research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_c4c4_radial_energy_dependence.py
      - name: Run C4-C4-B unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_p1iii_eos_c4c4_radial_energy_dependence.py' -v

  compute:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        energy: [10, 20, 40, 60, 150]
        radial_shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy numba
      - name: Compute one energy and radial shard
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: |
          mkdir -p "$RUNNER_TEMP/c4c4-b-shard"
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c4_radial_energy_dependence.py \
            --energy "${{ matrix.energy }}" \
            --shard-index "${{ matrix.radial_shard }}" \
            --shard-count 5 \
            --output-dir "$RUNNER_TEMP/c4c4-b-shard"
      - name: Upload immutable numerical shard
        uses: actions/upload-artifact@v4
        with:
          name: c4c4-b-E${{ matrix.energy }}-S${{ matrix.radial_shard }}
          path: ${{ runner.temp }}/c4c4-b-shard/*
          if-no-files-found: error
          retention-days: 30

  merge-and-archive:
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy numba
      - name: Download all 25 immutable shards
        uses: actions/download-artifact@v4
        with:
          pattern: c4c4-b-*
          path: ${{ runner.temp }}/c4c4-b-shards
          merge-multiple: true
      - name: Merge, cross-check, and archive numerical outputs
        env:
          OUTPUT_DIR: research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/c4c4_energy_dependence_radial_2026-11-13
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c4_radial_energy_dependence.py \
            --merge-dir "$RUNNER_TEMP/c4c4-b-shards" \
            --output-dir "$OUTPUT_DIR" \
            --source-commit "$GITHUB_SHA"
      - name: Upload complete numerical archive
        uses: actions/upload-artifact@v4
        with:
          name: c4c4-b-full-radial-energy-dependence
          path: research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/c4c4_energy_dependence_radial_2026-11-13/*
          if-no-files-found: error
          retention-days: 90
      - name: Commit numerical archive separately from source code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/c4c4_energy_dependence_radial_2026-11-13
          git commit -m "data: archive C4-C4-B full-radial energy scan"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Report numerical acceptance status after preserving the archive
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c4_radial_energy_dependence.py \
            --check-summary research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/c4c4_energy_dependence_radial_2026-11-13/summary.json
