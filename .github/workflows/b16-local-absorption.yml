name: B.16 independent local absorption audit

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_local_absorption.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_local_absorption.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_reference.py'
      - '.github/workflows/b16-local-absorption.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b16-local-absorption-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run independent local absorption tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_local_absorption.py' -v
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_reference.py' -v

      - name: Run B.6--B.10 and B.13--B.19 local audit
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_local_absorption.py \
            --mass 10 --neutrino-order 512 --susceptibility-order 256 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_local_absorption_10mev_2026-11-09.json

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

