name: Temporary PR55 LaTeX build

on:
  push:
    branches:
      - review/response-point-conclusions-20261106

permissions:
  contents: read

jobs:
  compile-referee-response:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch commit
        uses: actions/checkout@v4

      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers poppler-utils python3-pil

      - name: Compile response letter with BibTeX
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/pages
          export BIBINPUTS="$GITHUB_WORKSPACE/overleaf-source/axial-vector-model-building-v6:$GITHUB_WORKSPACE:"
          export BSTINPUTS="$GITHUB_WORKSPACE:"
          latexmk -pdf -bibtex -interaction=nonstopmode -file-line-error -halt-on-error -outdir=build Replies_to_Referee_3_referee_facing_2026-11-04.tex 2>&1 | tee build/latexmk.stdout.log
          cp build/Replies_to_Referee_3_referee_facing_2026-11-04.pdf ./Replies_to_Referee_3_referee_facing_2026-11-04.pdf

      - name: Inspect PDF structure and render every page
        run: |
          pdfinfo Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdfinfo.txt
          pdftotext -layout Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/reply.txt
          pdftoppm -png -r 120 Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/pages/page
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          pages = sorted(Path("build/pages").glob("page-*.png"))
          if not pages:
              raise SystemExit("No rendered PDF pages found")
          thumbs = []
          for p in pages:
              im = Image.open(p).convert("RGB")
              im.thumbnail((420, 594))
              canvas = Image.new("RGB", (440, 624), "white")
              canvas.paste(im, ((440-im.width)//2, 20))
              ImageDraw.Draw(canvas).text((12, 4), p.stem, fill="black")
              thumbs.append(canvas)
          cols = 3
          rows = (len(thumbs)+cols-1)//cols
          sheet = Image.new("RGB", (cols*440, rows*624), (220,220,220))
          for i, im in enumerate(thumbs):
              sheet.paste(im, ((i%cols)*440, (i//cols)*624))
          sheet.save("build/contact-sheet.png")
          print(f"Rendered {len(pages)} pages")
          PY

      - name: Upload compiled PDF, logs, text extraction, and page renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr55-latex-build
          path: |
            Replies_to_Referee_3_referee_facing_2026-11-04.pdf
            build/
          if-no-files-found: warn
          retention-days: 7
