name: Croon C1 10 MeV adaptive radial boundary-layer baseline

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-c1-10mev-adaptive-radial-baseline.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/adaptive_radial_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_c1_b13_vector_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_croon_c1_b13_vector_transport.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-adaptive-radial-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision and reviewed profile identity
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run C1 and adaptive radial regression tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python -m unittest -v test_croon_c1_b13_vector_transport.py
      - name: Compute 10 MeV C1 transport with independent adaptive radial integration
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python croon_c1_b13_vector_transport.py \
            --masses 10.0 \
            --radial-points 101 \
            --energy-order 32 \
            --inner-orders 12,8,8,8 \
            --neutrino-order 128 \
            --susceptibility-order 192 \
            --coupling-count 121 \
            --adaptive-radial \
            --output outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json \
            --csv outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.csv
      - name: Validate adaptive luminosity curves and mode closure
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          path = Path("outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json")
          data = json.loads(path.read_text())
          assert data["numerics"]["adaptive_radial_enabled"] is True
          item = data["masses"]["10"]
          assert item["adaptive_radial_enabled"] is True
          assert item["radial_points"] == 103
          assert item["energy_points"] == 32
          assert item["polarization_modes"] == ["L", "+", "-"]
          assert len(item["coupling_curve"]) == 121
          assert all(v is not None and v > 0 for v in item["adaptive_radial_surface_asymptote_Rnu_erg_s_by_mode"].values())
          for row in item["coupling_curve"]:
              for key in (
                  "Rfar_Rnu_adaptive_quad",
                  "Rfar_100km_vacuum_nu_tail_adaptive_quad",
                  "Rfar_Rnu_adaptive_quad_relative_error_estimate",
                  "Rfar_100km_vacuum_nu_tail_adaptive_quad_relative_error_estimate",
              ):
                  assert math.isfinite(row[key]) and row[key] >= 0, (key, row[key])
              assert row["Rfar_100km_vacuum_nu_tail_adaptive_quad"] <= row["Rfar_Rnu_adaptive_quad"] * (1.0 + 1e-12)
              for label in ("Rfar_Rnu", "Rfar_100km_vacuum_nu_tail"):
                  mode_key = label + "_adaptive_quad_by_mode_erg_s"
                  total_key = label + "_adaptive_quad"
                  error_mode_key = label + "_adaptive_quad_relative_error_estimate_by_mode"
                  modes = row[mode_key]
                  assert set(modes) == {"L", "+", "-"}
                  assert all(math.isfinite(v) and v >= 0 for v in modes.values())
                  assert set(row[error_mode_key]) == {"L", "+", "-"}
                  assert all(math.isfinite(v) and v < 1e-6 for v in row[error_mode_key].values())
                  residual = abs(sum(modes.values()) - row[total_key]) / max(abs(row[total_key]), 1e-300)
                  assert residual < 1e-12
          max_error = max(
              max(
                  row["Rfar_Rnu_adaptive_quad_relative_error_estimate"],
                  row["Rfar_100km_vacuum_nu_tail_adaptive_quad_relative_error_estimate"],
                  *row["Rfar_Rnu_adaptive_quad_relative_error_estimate_by_mode"].values(),
                  *row["Rfar_100km_vacuum_nu_tail_adaptive_quad_relative_error_estimate_by_mode"].values(),
              )
              for row in item["coupling_curve"]
          )
          assert max_error < 1e-6, max_error
          print("Adaptive radial C1 10 MeV baseline: PASS")
          print("surface asymptote [erg/s]:", item["adaptive_radial_surface_asymptote_Rnu_erg_s_by_mode"])
          print("maximum QUADPACK relative error estimate:", max_error)
          for row in (item["coupling_curve"][0], item["coupling_curve"][60], item["coupling_curve"][-1]):
              print("gX", row["g_X"],
                    "L_Rnu", row["Rfar_Rnu_adaptive_quad"],
                    "L_100km", row["Rfar_100km_vacuum_nu_tail_adaptive_quad"])
          PY
      - name: Create SHA-256 manifest for adaptive native outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json \
            outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.csv \
            > outputs/SHA256SUMS_croon_c1_adaptive_radial_2026-11-20.txt
      - name: Upload native adaptive outputs before Git archival
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-10mev-adaptive-radial-baseline-2026-11-20
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_adaptive_radial_2026-11-20.txt
          if-no-files-found: error
      - name: Commit adaptive radial results to the research branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_adaptive_radial_2026-11-20.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive C1 adaptive radial boundary-layer baseline"
            for attempt in 1 2 3; do
              git fetch origin "research/croon-vector-benchmark-and-rate-corrections-20261119"
              git rebase "origin/research/croon-vector-benchmark-and-rate-corrections-20261119"
              if git push origin "HEAD:research/croon-vector-benchmark-and-rate-corrections-20261119"; then
                exit 0
              fi
            done
            exit 1
          fi
