name: Axial structured result validation

on:
  pull_request:
    paths:
      - "docs/repository-management/schemas/**"
      - "docs/repository-management/STRUCTURED_RESULT_DATA_STANDARD.md"
      - ".github/workflows/axial-structured-result-validation.yml"
      - "results/**"
  push:
    branches:
      - main
    paths:
      - "docs/repository-management/schemas/**"
      - "docs/repository-management/STRUCTURED_RESULT_DATA_STANDARD.md"
      - ".github/workflows/axial-structured-result-validation.yml"
      - "results/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install -r docs/repository-management/schemas/requirements-result-validation.txt

      - name: Run structured-result regression tests
        run: python -m unittest discover -s docs/repository-management/schemas/tests -v

      - name: Validate structured records and referenced artifacts
        shell: bash
        run: |
          mapfile -d '' records < <(find results -type f \
            \( -name 'run_manifest.json' -o -name 'result_summary.json' -o -name 'validation_report.json' \) \
            -print0 | sort -z)
          if (( ${#records[@]} )); then
            python docs/repository-management/schemas/validate_result_records.py --repo-root . "${records[@]}"
          else
            echo "No structured result records found; schema unit tests remain the applicable checks."
          fi

      - name: Compile validator
        run: python -m compileall -q docs/repository-management/schemas
