name: Export minimal axial transport source

on:
  push:
    branches:
      - transfer/axial-minimal-source-20261123
    paths:
      - .github/workflows/export-axial-minimal-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Assemble minimal source bundle
        shell: bash
        run: |
          set -euo pipefail
          root=research/stellar-cooling-constraints-20261105
          out=/tmp/axial-minimal-source
          mkdir -p "$out/data" "$out/finite_mixing"
          cp "$root/rates.py" "$root/transport.py" "$root/run_scan.py" "$out/"
          cp "$root/data/sfho188_digitized.csv" "$root/data/"
          cp "$root/data/profile_provenance.json" "$out/data/"
          cp "$root/finite_mixing/moving_muon_compton.py" "$out/finite_mixing/"
          cp "$root/finite_mixing/thermal_response_scan.py" "$out/finite_mixing/"
          cp "$root/finite_mixing/thermal_dimuon.py" "$out/finite_mixing/"
          cp "$root/finite_mixing/test_thermal_rates.py" "$out/finite_mixing/"
          cp "$root/finite_mixing/thermal_integrals/test_moving_compton.py" "$out/finite_mixing/"
          cp "$root/finite_mixing/test_b13_moving_muon_spinor_reference.py" "$out/finite_mixing/"
          cp "$root/requirements-b16-audit.txt" "$out/"
          cp "$root/finite_mixing/MOVING_MUON_THERMAL_RATE_AUDIT_2026-11-07.md" "$out/finite_mixing/"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
          cd /tmp
          zip -qr axial-minimal-source.zip axial-minimal-source
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: axial-minimal-source
          path: /tmp/axial-minimal-source.zip
          if-no-files-found: error
          retention-days: 3
