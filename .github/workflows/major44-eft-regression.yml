name: Major 4.4 EFT numerical validation

on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/*.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/**'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/**'
      - 'research/stellar-cooling-constraints-20261105/data/**'
      - 'research/stellar-cooling-eft-literature-20261105/*.py'
      - '.github/workflows/major44-eft-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: major44-eft-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib
      - name: Run rate, transport, and independent kernel tests
        run: |
          python -m unittest discover -s research/stellar-cooling-constraints-20261105 -p 'test_*.py' -v
          python -m unittest discover -s research/stellar-cooling-constraints-20261105/blinov_reproduction -p 'test_*.py' -v
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py \
            --masses 1,10,100,200 --nr 40 --ne 100 --na 16 --ns 32 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/blinov_literal_scan.json
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/compare_reference.py \
            --scan research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/blinov_literal_scan.json \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig4_fig7_comparison.json
          python research/stellar-cooling-constraints-20261105/audit_muon_susceptibility.py --check --output research/stellar-cooling-constraints-20261105/outputs/vector_audit/muon_susceptibility_charge_audit.json
          python research/stellar-cooling-eft-literature-20261105/check_literature_kernels.py \
            --matrix-script research/stellar-cooling-eft-literature-20261105/reference_matrix_element.py \
            --output research/stellar-cooling-eft-literature-20261105/literature_kernel_validation.json
      - name: Validate saved scans and regenerate figures
        run: |
          python research/stellar-cooling-constraints-20261105/validate_outputs.py
          python research/stellar-cooling-constraints-20261105/plot_constraints.py
      - name: Check numerical validation records are reproducible
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/outputs/numerical_validation.json \
            research/stellar-cooling-constraints-20261105/outputs/vector_audit/muon_susceptibility_charge_audit.json
          echo "The independent kernel checker is tolerance-based; its JSON may differ in final floating-point digits across runners."
      - name: Publish regenerated figure assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.ref_name }}"
          git fetch origin "$BRANCH"
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_reply.png
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_reply.pdf
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_gev.png
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_gev.pdf
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_reply_gev.png
          git add research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_reply_gev.pdf
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/blinov_literal_scan.json
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig4_fig7_comparison.json
          if git diff --cached --quiet; then
            echo "Reply figure assets are already current."
          else
            git commit -m "Archive independent Blinov reference scan and refresh reply figures"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:${BRANCH}"
          fi
