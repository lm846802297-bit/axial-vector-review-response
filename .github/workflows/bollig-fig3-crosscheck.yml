name: Independent Bollig Fig. 3 muon-density profile cross-check

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/bollig-fig3-crosscheck.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/inspect_bollig_fig3_vectors.py'

permissions:
  contents: write

concurrency:
  group: profile-12-15km-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF vector extraction dependency
        run: python -m pip install --upgrade pymupdf

      - name: Inspect Bollig Fig. 3 PDF vectors
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/inspect_bollig_fig3_vectors.py \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig3_muon_density_vector_inventory_2026-11-09.json

      - name: Archive vector inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig3_muon_density_vector_inventory_2026-11-09.json
          if git diff --cached --quiet; then
            echo "No vector inventory changes."
          else
            git commit -m "Archive independent Bollig Fig. 3 muon-density vector inventory"
            git push
          fi
