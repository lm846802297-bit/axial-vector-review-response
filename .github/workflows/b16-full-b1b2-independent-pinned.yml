name: B16 full independent B.1+B.2 pinned NumPy luminosity reproduction

on:
  push:
    branches:
      - maintenance/repository-organization-audit-20261114
    paths:
      - '.github/workflows/b16-full-b1b2-independent-pinned.yml'
      - 'research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1b2_full_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_path_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_b1b2_full_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-full-b1b2-independent-pinned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-full-b1b2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4

      - name: Require the reviewed maintenance branch
        run: |
          test "$GITHUB_REF" = "refs/heads/maintenance/repository-organization-audit-20261114"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt

      - name: Verify exact runtime
        run: |
          python - <<'PY'
          import sys, numpy, scipy
          assert sys.version_info[:3] == (3, 12, 14)
          assert numpy.__version__ == "2.5.4"
          assert scipy.__version__ == "1.18.1"
          print("Python:", sys.version)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          PY
          python -m pip freeze

      - name: Run full B.1+B.2 angular escape tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_b1b2_full_independent.py' -v

      - name: Recompute full independent fixed-omega B.1+B.2 luminosity curve
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1b2_full_independent.py \
            --b1-output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json \
            --b2-output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_full_b1b2_independent_10mev_2026-11-15_numpy_pinned.json \
            --mass 10 --radius 25 --radial-order 4 --energy-order 4 \
            --energy-panels 80 --energy-offset 2000 --angular-order 16

      - name: Verify pinned B.1/B.2 input provenance and full-curve closure
        run: |
          python - <<'PY'
          import hashlib, json, math, re
          from pathlib import Path
          root = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction")
          out_path = root / "outputs/b16_full_b1b2_independent_10mev_2026-11-15_numpy_pinned.json"
          b1_path = root / "outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json"
          b2_path = root / "outputs/b16_path_independent_analytic_10mev_2026-11-15_numpy_pinned.json"
          baseline_path = root / "outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json"
          fig7_path = Path("research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json")
          d = json.loads(out_path.read_text())
          b1 = json.loads(b1_path.read_text())
          b2 = json.loads(b2_path.read_text())
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert d.get("run_commit_sha")
          assert re.fullmatch(r"[0-9a-f]{64}", d.get("code_sha256", ""))
          assert d["profile"]["sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert d["baseline_reference_sha256"] == b1["baseline_reference_sha256"] == b2["archived_b16_baseline_sha256"] == sha(baseline_path)
          assert d["independent_b1_output_sha256"] == sha(b1_path)
          assert d["independent_b2_output_sha256"] == sha(b2_path)
          assert d["fig7_reference_sha256"] == b2["fig7_reference_sha256"] == sha(fig7_path)
          assert b1["run_commit_sha"] == "6c2cdf858cf908f5ba390f4dfae82e01abb132fc"
          assert b2["run_commit_sha"] == "e200faa10e510edfc4bf32990cda08ef26da0ca8"
          c = d["configuration"]
          assert c["mass_MeV"] == 10.0 and c["radius_km"] == 25.0
          assert c["radial_order"] == 4 and c["energy_panels_per_source_radius"] == 80
          assert c["energy_gauss_order"] == 4 and c["energy_upper_offset_MeV"] == 2000.0
          assert c["angular_order"] == 16 and c["coupling_points"] == 25
          assert c["source_radial_nodes_compared"] == [100, 200]
          closure = d["source_closure"]
          assert abs(closure["relative_difference_vs_independent_b1_400_node"]) < 3.0e-5
          assert abs(closure["relative_difference_vs_archived_b16_thin_source"]) < 0.01
          assert d["maximum_absolute_relative_difference_vs_archived_b16"] < 0.01
          assert d["maximum_absolute_relative_difference_vs_fig7"] > 0.8
          assert d["final_curve_metrics_vs_fig7"]["n_points"] == 25
          assert d["final_curve_metrics_vs_fig7"]["strong_absorption_relative_difference"] > 0.8
          assert d["radial_convergence"]["maximum_absolute_luminosity_shift"] < 0.003
          assert d["production_axial_outputs_modified"] is False
          def check_finite(value):
              if isinstance(value, float):
                  assert math.isfinite(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      check_finite(item)
              elif isinstance(value, list):
                  for item in value:
                      check_finite(item)
          check_finite(d)
          print(json.dumps({
              "source_closure": closure,
              "radial_convergence": d["radial_convergence"],
              "final_curve_metrics_vs_archived_b16": d["final_curve_metrics_vs_archived_b16"],
              "final_curve_metrics_vs_fig7": d["final_curve_metrics_vs_fig7"],
              "maximum_absolute_relative_difference_vs_archived_b16": d["maximum_absolute_relative_difference_vs_archived_b16"],
              "maximum_absolute_relative_difference_vs_fig7": d["maximum_absolute_relative_difference_vs_fig7"],
          }, indent=2))
          PY

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Save pinned full B.1+B.2 output to the reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_full_b1b2_independent_10mev_2026-11-15_numpy_pinned.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "results(b16): archive pinned full independent B1B2 luminosity"
            git push origin HEAD:maintenance/repository-organization-audit-20261114
          fi
