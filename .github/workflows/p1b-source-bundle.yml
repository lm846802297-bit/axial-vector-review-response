name: P1-B local-compute source bundle

on:
  push:
    branches:
      - research/fig7-10mev-transport-localization-20261113-v2
      - research/p1b-global02-full-radial-20261114
    paths:
      - .github/workflows/p1b-source-bundle.yml
      - research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py
      - research/stellar-cooling-constraints-20261105/rates.py
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py
      - research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - research/stellar-cooling-constraints-20261105/data/profile_provenance.json
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/audit_b13_local_kernel_radial_energy_10mev.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/test_p1b_b13_local_kernel_radial_energy_10mev.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_energy_anchor.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_global_energy_scan.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_global_energy_scan_dynamic.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/postprocess_p1b_e1_global_scan.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_radial_midpoint_top_intervals.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_targeted_high_order_checks.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_global_2d_midpoint_screen.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/postprocess_p1b_e1_global_2d_midpoint_screen.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_p1b_e1_global_2d_targeted_high_order.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/extend_p1b_e1_global_03_x36_interval_0702.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p1b-source-bundle.yml

permissions:
  contents: read

jobs:
  package-reproducible-local-input:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assemble minimal source and input bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1b-local-bundle
          root=research/stellar-cooling-constraints-20261105
          cp -a "$root/rates.py" /tmp/p1b-local-bundle/
          cp -a "$root/finite_mixing" /tmp/p1b-local-bundle/
          cp -a "$root/blinov_reproduction" /tmp/p1b-local-bundle/
          cp -a "$root/data" /tmp/p1b-local-bundle/
          find /tmp/p1b-local-bundle -type f ! -name '__init__.py' ! -path '*/moving_muon_compton.py' ! -path '*/rates.py' ! -path '*/reference.py' ! -path '*/audit_b13_local_kernel_radial_energy_10mev.py' ! -path '*/test_p1b_b13_local_kernel_radial_energy_10mev.py' ! -path '*/run_p1b_e1_energy_anchor.py' ! -path '*/run_p1b_e1_global_energy_scan.py' ! -path '*/run_p1b_e1_global_energy_scan_dynamic.py' ! -path '*/postprocess_p1b_e1_global_scan.py' ! -path '*/run_p1b_e1_radial_midpoint_top_intervals.py' ! -path '*/run_p1b_e1_targeted_high_order_checks.py' ! -path '*/run_p1b_e1_global_2d_midpoint_screen.py' ! -path '*/postprocess_p1b_e1_global_2d_midpoint_screen.py' ! -path '*/run_p1b_e1_global_2d_targeted_high_order.py' ! -path '*/extend_p1b_e1_global_03_x36_interval_0702.py' ! -path '*/sfho188_digitized.csv' ! -path '*/profile_provenance.json' -delete
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "python=3.12"
            find /tmp/p1b-local-bundle -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum
          } > /tmp/p1b-local-bundle/MANIFEST.sha256
          cp -a /tmp/p1b-local-bundle "$GITHUB_WORKSPACE/p1b-local-bundle"

      - name: Upload source bundle for local execution
        uses: actions/upload-artifact@v4
        with:
          name: p1b-local-compute-source
          path: p1b-local-bundle/
          retention-days: 30
