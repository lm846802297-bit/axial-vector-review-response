name: Bollig muon density and B.1 source audit

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_bollig_muon_density_and_b1_source.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/data/n_mu_over_n0_caputo_vertices.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig3_fig4_vector_paths_2026-11-09.json'
      - '.github/workflows/bollig-muon-density-b1-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bollig-muon-density-b1-audit-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run Fig. 3 density, Fermi-density, and B.1 source audit
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_bollig_muon_density_and_b1_source.py
      - name: Verify production rates and transport remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive audit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_muon_density_b1_source_audit_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Muon-density/B.1 audit output is already current."
          else
            git commit -m "Archive Bollig muon density and B1 source audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin "\${GITHUB_REF_NAME}"
              git rebase "origin/\${GITHUB_REF_NAME}"
              if git push origin "HEAD:\${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive muon-density/B.1 audit after five retries."
            exit 1
          fi
