name: B.13 exact Compton audit on vertex-preserving profile

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b13-exact-compton-vertex-preserving.yml'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_exact_compton_opacity_radial.py'
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b13-exact-compton-vertex-preserving-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run exact-versus-approximate Compton tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -p 'test_b13_b16_comparison.py' -v
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -p 'test_b13_b16_mass_scan.py' -v
      - name: Recompute radial B.13 versus B.14--B.16 comparison
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_exact_compton_opacity_radial.py \
            --mass 10 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_exact_compton_opacity_radial_vertex_preserving_10mev_2026-11-09.json
      - name: Verify the current vertex-preserving profile was used
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_exact_compton_opacity_radial_vertex_preserving_10mev_2026-11-09.json")
          d = json.loads(p.read_text())
          expected = "6c47d0712d266848d0cb2315c8a9b43cf13d0b39b6986d4239dd3f22cb9ba0bc"
          actual = d["profile"]["sha256"]
          if actual != expected:
              raise SystemExit(f"Unexpected profile SHA: {actual}")
          print(f"Confirmed vertex-preserving profile SHA-256: {actual}")
          PY
      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive machine-readable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_exact_compton_opacity_radial_vertex_preserving_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "Vertex-preserving B.13 output is already current."
          else
            git commit -m "Archive B.13 Compton audit on vertex-preserving profile"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive the vertex-preserving B.13 audit after five retries."
            exit 1
          fi
