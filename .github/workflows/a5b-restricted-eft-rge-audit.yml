name: A5b restricted EFT RGE audit

on:
  push:
    branches:
      - research/major1-higgs-scalar-mixing-20261109
    paths:
      - "research/major1-higgs-scalar-mixing-20261109/a5b_dim6_derivative_rge_audit.py"
      - ".github/workflows/a5b-restricted-eft-rge-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/major1-higgs-scalar-mixing-20261109/a5b_dim6_derivative_rge_audit.py"
      - ".github/workflows/a5b-restricted-eft-rge-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-rge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install symbolic dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install sympy==1.14.0

      - name: Run the A5b restricted RGE audit
        run: |
          set -o pipefail
          python -m py_compile research/major1-higgs-scalar-mixing-20261109/a5b_dim6_derivative_rge_audit.py
          python research/major1-higgs-scalar-mixing-20261109/a5b_dim6_derivative_rge_audit.py \
            | tee A5B_RESTRICTED_EFT_RGE_AUDIT_CI_OUTPUT.txt

      - name: Hash exact source and output
        run: |
          sha256sum \
            research/major1-higgs-scalar-mixing-20261109/a5b_dim6_derivative_rge_audit.py \
            A5B_RESTRICTED_EFT_RGE_AUDIT_CI_OUTPUT.txt \
            > A5B_RESTRICTED_EFT_RGE_AUDIT_CI_SHA256SUMS.txt

      - name: Upload independent CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: a5b-restricted-eft-rge-audit
          path: |
            A5B_RESTRICTED_EFT_RGE_AUDIT_CI_OUTPUT.txt
            A5B_RESTRICTED_EFT_RGE_AUDIT_CI_SHA256SUMS.txt
