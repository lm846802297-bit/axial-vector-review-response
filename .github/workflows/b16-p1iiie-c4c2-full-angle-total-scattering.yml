name: P1-IIIe-C4C2 full-angle total scattering

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-p1iiie-c4c2-full-angle-total-scattering.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_b_stationary_dirac_trace.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_b_moving_fermi_gas_collision_kernel.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_full_radial_occupation.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4b2_effective_mass_collision_kernel.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c1_exact_outgoing_energy_support.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c2_full_angle_total_scattering.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_c4c2_full_angle_total_scattering.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1iiie-c4c2-full-angle-total-scattering
  cancel-in-progress: false

jobs:
  full-angle-total-scattering:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run C4-C2 unit tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: python -m unittest test_b16_p1iii_eos_c4c2_full_angle_total_scattering -v

      - name: Recompute full-angle EOS total scattering rates
        env:
          C4C2_DIR: \${{ runner.temp }}/c4c2
        run: |
          set -euo pipefail
          mkdir -p "$C4C2_DIR"
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_c4c2_full_angle_total_scattering.py --profile research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv --c2-reference research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv --output-json "$C4C2_DIR/summary.json" --output-local-csv "$C4C2_DIR/local_total_rates.csv" --output-cold-csv "$C4C2_DIR/cold_horowitz_total.csv" --output-angle-csv "$C4C2_DIR/angle_convergence.csv" --output-kernel-order-csv "$C4C2_DIR/kernel_order_convergence.csv"

      - name: Validate C4-C2 numerical outputs
        env:
          C4C2_DIR: \${{ runner.temp }}/c4c2
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          root = Path(os.environ["C4C2_DIR"])
          summary = json.loads((root / "summary.json").read_text())
          assert summary["overall_pass"]
          assert all(summary["acceptance"].values())
          assert summary["provenance"]["selected_radii_km"] == [0.2, 5.0, 10.0, 15.2]
          for name, count in (
              ("local_total_rates.csv", 16),
              ("cold_horowitz_total.csv", 4),
              ("angle_convergence.csv", 8),
              ("kernel_order_convergence.csv", 2),
          ):
              with (root / name).open(newline="") as stream:
                  rows = list(csv.DictReader(stream))
              assert len(rows) == count, (name, len(rows))
          assert summary["maxima"]["cold_total_Horowitz_relative_residual"] < 1e-3
          assert summary["maxima"]["EOS_local_cos8_to_cos12_relative_difference"] < 1e-2
          assert summary["maxima"]["EOS_kernel_p36phi12_to_p48phi16_relative_difference"] < 1e-2
          print(json.dumps(summary["maxima"], indent=2))
          PY

      - name: Upload C4-C2 numerical outputs
        uses: actions/upload-artifact@v4
        with:
          name: c4c2-full-angle-total-scattering
          path: \${{ runner.temp }}/c4c2/
          if-no-files-found: error
          retention-days: 90
