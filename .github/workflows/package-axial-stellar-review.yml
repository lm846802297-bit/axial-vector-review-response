name: Build axial stellar-cooling review package

on:
  push:
    branches:
      - research/stellar-cooling-review-package-20261113
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-review-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: research/stellar-cooling-review-package-20261113

      - name: Assemble package from extracted repository files
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          repo_root = Path(".")
          calc = Path("research/stellar-cooling-constraints-20261105")
          literature = Path("research/stellar-cooling-eft-literature-20261105")
          roots = [calc, literature]

          def excluded(path):
              rel = path.relative_to(repo_root)
              if "review_package_parts" in rel.parts:
                  return True
              if "__pycache__" in rel.parts or path.suffix == ".pyc":
                  return True
              if path.suffix.lower() in {".zip", ".gz", ".b64"}:
                  return True
              if ".part-" in path.name:
                  return True
              return False

          files = {}
          for root in roots:
              if not root.exists():
                  raise RuntimeError(f"Required source directory is missing: {root}")
              for path in sorted(root.rglob("*")):
                  if path.is_file() and not excluded(path):
                      rel = path.relative_to(repo_root).as_posix()
                      files[rel] = path.read_bytes()

          if len(files) < 500:
              raise RuntimeError(f"Unexpectedly small package payload: {len(files)} files")

          # Validate every archived JSON payload before writing the ZIP.
          for name, data in files.items():
              if name.endswith(".json"):
                  json.loads(data.decode("utf-8"))


          package_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          source_baseline = "81d9b2faf16eb39879b759b05afce46732c925d7"
          branch_name = "research/stellar-cooling-review-package-20261113"

          blob_map = {}
          listing = subprocess.check_output(["git", "ls-tree", "-r", "-l", "HEAD"], text=True)
          for line in listing.splitlines():
              meta, path = line.split("\t", 1)
              fields = meta.split()
              if len(fields) >= 3 and fields[1] == "blob":
                  blob_map[path] = fields[2]

          missing_blobs = sorted(set(files) - set(blob_map))
          if missing_blobs:
              raise RuntimeError(f"Files missing from Git tree: {missing_blobs[:10]}")

          total_bytes = sum(len(data) for data in files.values())
          readme = f"""# Axial stellar-cooling independent-review package

          Prepared: {datetime.now(timezone.utc).isoformat()}
          Repository: https://github.com/lm846802297-bit/axial-vector-review-response
          Calculation source baseline: {source_baseline}
          Package branch: {branch_name}
          Package branch commit: {package_head}

          ## Scope

          This package is an extracted, self-contained snapshot of the axial-EFT fixed-profile ballistic-cooling benchmark and its associated independent reference audits. It includes source programs, reconstructed profile inputs, saved numerical scans, figures, tests, and B.13/B.16 transport diagnostics.

          It is NOT a final SN1987A exclusion. The pure-vector Blinov Fig. 7 10-MeV strong-absorption validation gate remains NOT PASSED (about +92.24% in the literal fixed-energy comparison). The baseline axial scan uses the initial-muon-rest/effective-density semi-Compton approximation and mode-resolved propagation. The separate literal Blinov reference uses the printed scalar-opacity prescription. These are not interchangeable.

          ## Reproduction

          Required Python packages: NumPy, SciPy, Matplotlib, PyMuPDF. Run from the extracted package root:

          ~~~bash
          python -m unittest discover -s research/stellar-cooling-constraints-20261105 -p "test_*.py" -v
          python research/stellar-cooling-eft-literature-20261105/check_literature_kernels.py --matrix-script research/stellar-cooling-eft-literature-20261105/reference_matrix_element.py --output research/stellar-cooling-eft-literature-20261105/literature_kernel_validation_reproduced.json
          python research/stellar-cooling-constraints-20261105/validate_outputs.py
          ~~~

          The scan JSONs and rendered PDFs/PNGs are preserved as generated; package assembly does not rerun or alter the physical scan.

          ## Exclusions

          No restricted Garching raw simulation tables are included. Raw compressed SFHo-FRDM EOS archive payloads (zip files, split part files, and gzip files) are excluded from this handoff; they are not inputs to the displayed fixed-profile axial contour. The associated code, provenance notes, and derived audit outputs remain in the repository/package where applicable. Re-running the separate EOS-dependent diagnostics requires obtaining the EOS release files described by their local README and checksum manifest.

          No ZIP, Base64 ZIP, or split archive is committed as package content. GitHub stores the extracted source/data/results. A short-retention Actions artifact is used only as a transfer mechanism for this user-delivered ZIP.
          """
          files["PACKAGE_README.md"] = readme.encode("utf-8")
          files["requirements-review.txt"] = (
              "# Versions are intentionally not pinned; record your environment when reproducing.\n"
              "numpy\nscipy\nmatplotlib\nPyMuPDF\n"
          ).encode("utf-8")

          provenance = {
              "repository": "lm846802297-bit/axial-vector-review-response",
              "calculation_source_baseline": source_baseline,
              "package_branch": branch_name,
              "package_branch_commit": package_head,
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "payload_file_count": len(files),
              "payload_bytes": total_bytes,
              "excluded_patterns": [
                  "*/review_package_parts/*",
                  "*.zip",
                  "*.gz",
                  "*.b64",
                  "*.part-*",
                  "__pycache__/*",
                  "*.pyc"
              ],
              "scientific_status": "fixed-profile ballistic-cooling benchmark; not a final SN1987A exclusion",
              "vector_fig7_10mev_gate": "NOT PASSED; literal fixed-energy high-absorption residual about +92.24%"
          }
          files["PROVENANCE.json"] = (json.dumps(provenance, indent=2, sort_keys=True) + "\n").encode("utf-8")

          index_rows = []
          for name in sorted(files):
              data = files[name]
              index_rows.append({
                  "path": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "git_blob_sha": blob_map.get(name, "generated-in-workflow")
              })
          import io
          buf = io.StringIO()
          writer = csv.DictWriter(buf, fieldnames=["path", "bytes", "sha256", "git_blob_sha"])
          writer.writeheader()
          writer.writerows(index_rows)
          files["PACKAGE_FILE_INDEX.csv"] = buf.getvalue().encode("utf-8")

          manifest_lines = []
          for name in sorted(files):
              manifest_lines.append(f"{hashlib.sha256(files[name]).hexdigest()}  {name}  bytes={len(files[name])}")
          files["SHA256SUMS.txt"] = ("\n".join(manifest_lines) + "\n").encode("utf-8")

          # Hard fail if any archive payload accidentally enters the package.
          bad_names = [name for name in files if name.lower().endswith((".zip", ".gz", ".b64")) or ".part-" in name]
          if bad_names:
              raise RuntimeError(f"Nested/encoded archive files are forbidden: {bad_names[:10]}")

          out = Path("dist/axial_stellar_constraints_review_package.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for name in sorted(files):
                  zf.writestr(name, files[name])

          with zipfile.ZipFile(out, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f"Master ZIP CRC failure: {bad}")
              if len(zf.namelist()) != len(files):
                  raise RuntimeError("ZIP member count does not match the file inventory")

          print(json.dumps({
              "package_commit": package_head,
              "source_baseline": source_baseline,
              "payload_file_count": len(files),
              "payload_bytes": total_bytes,
              "archive": str(out),
              "archive_bytes": out.stat().st_size,
              "archive_sha256": hashlib.sha256(out.read_bytes()).hexdigest(),
              "nested_archives": 0
          }, indent=2))
          PY

      - name: Upload short-retention handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: axial-stellar-constraints-review-package
          path: dist/axial_stellar_constraints_review_package.zip
          if-no-files-found: error
          retention-days: 1
