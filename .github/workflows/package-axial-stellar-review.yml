name: Build axial stellar-cooling review package

on:
  push:
    branches:
      - research/stellar-cooling-review-package-20261113
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package-review-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned review branch
        uses: actions/checkout@v4
        with:
          ref: research/stellar-cooling-review-package-20261113

      - name: Assemble verified ZIP from the small package parts
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          repo_root = Path(".")
          calc = Path("research/stellar-cooling-constraints-20261105")
          parts_dir = calc / "review_package_parts"
          part_names = [
              "01_sources_profile_report.zip.b64",
              "02A1_axial_scan.zip.b64",
              "02A2_vector_scan.zip.b64",
              "02A3_endpoint_validation.zip.b64",
              "02B1_convergence_refinements.zip.b64",
              "02B2a_profile_sensitivity.zip.b64",
              "02B2b_coupling_and_vector_audit.zip.b64",
              "03A_figures_mev_and_wide.zip.b64",
              "03B_figures_gev_and_luminosity_png.zip.b64",
              "04A_source_tests_reference.zip.b64",
              "04B_reference_diagnostics_and_audits.zip.b64",
              "04C_reference_helpers.zip.b64",
          ]

          files = {}
          git_blob_map = {}
          for part_name in part_names:
              raw = (parts_dir / part_name).read_text(encoding="ascii")
              payload = base64.b64decode(raw, validate=True)
              with zipfile.ZipFile(io.BytesIO(payload), "r") as part_zip:
                  bad = part_zip.testzip()
                  if bad:
                      raise RuntimeError(f"{part_name}: CRC failure in {bad}")
                  for member in part_zip.infolist():
                      if member.is_dir():
                          continue
                      name = member.filename
                      data = part_zip.read(member)
                      if name == "PART_README.txt":
                          name = f"package_metadata/part_{part_name.removesuffix('.zip.b64')}_README.txt"
                      elif name.startswith("SHA256") or name.startswith("GIT_BLOB"):
                          name = f"package_metadata/part_{part_name.removesuffix('.zip.b64')}_{name}"
                      elif name.startswith("source/"):
                          name = "research/stellar-cooling-constraints-20261105/" + name[len("source/"):]
                      elif name.startswith("reports/"):
                          name = "research/stellar-cooling-constraints-20261105/" + name[len("reports/"):]
                      else:
                          name = "research/stellar-cooling-constraints-20261105/" + name
                      if name in files:
                          raise RuntimeError(f"Duplicate package path: {name}")
                      files[name] = data

          report_path = calc / "AXIAL_STELLAR_CONSTRAINTS_CALCULATION_AND_REVIEW_2026-11-13.md"
          files[str(report_path)] = report_path.read_bytes()
          init_path = calc / "blinov_reproduction" / "__init__.py"
          files[str(init_path)] = init_path.read_bytes()

          readme = """# Axial stellar-cooling constraint review package

          Prepared 2026-11-13. Single source-and-results snapshot for independent technical review.

          ## Provenance
          - Repository: https://github.com/lm846802297-bit/axial-vector-review-response
          - Numerical source baseline: 81d9b2faf16eb39879b759b05afce46732c925d7
          - Package branch: research/stellar-cooling-review-package-20261113
          - Calculation directory: research/stellar-cooling-constraints-20261105/
          - Profile data are reconstructed from public paper figures; no restricted Garching raw simulation tables are included.

          ## Contents
          Production axial EFT rates/transport/scan/profile/plot/validation code; reconstructed SFHo-18.8 profile and provenance; axial/vector/endpoint scans; convergence/refinement/sensitivity outputs; numerical validation JSON; original PDFs/PNGs; independent literal Blinov vector reference code and digitized comparison inputs; tests and detailed-balance/equation-chain/profile/opacity diagnostics; review and audit notes.

          ## Reproduction
          Python 3 with NumPy, SciPy and Matplotlib is required. Profile extraction additionally requires PyMuPDF. No version-pinned environment lockfile was present; record python --version and python -m pip freeze when rerunning.

          From repository root after extraction:
          python -m unittest discover -s research/stellar-cooling-constraints-20261105 -p "test_*.py" -v
          python research/stellar-cooling-constraints-20261105/run_scan.py --mass-count 68 --nr 88 --ne 180 --na 24 --ns 64 --nc 40 --gmax 1e-3 --gcount 301 --output research/stellar-cooling-constraints-20261105/outputs/axial_reproduced.json
          python research/stellar-cooling-constraints-20261105/run_scan.py --mass-count 68 --nr 88 --ne 180 --na 24 --ns 64 --nc 40 --current vector --gmax 1e-3 --gcount 301 --output research/stellar-cooling-constraints-20261105/outputs/vector_reproduced.json
          python research/stellar-cooling-constraints-20261105/validate_outputs.py
          python research/stellar-cooling-constraints-20261105/plot_constraints.py

          Endpoint masses 250, 255, 260, 265 and 270 MeV are archived separately in outputs/endpoint.json.

          ## Critical physics status
          This is a reproducible fixed-profile ballistic-cooling benchmark, not a final SN1987A exclusion. The pure-vector Blinov Fig. 7 validation gate remains NOT PASSED at the 10 MeV strong-absorption tail (about +92.24% at the high-coupling endpoint). The calculation uses a reconstructed public-figure profile, an initial-muon-rest/effective-density semi-Compton approximation, mode-resolved axial propagation, and the stated fixed-energy chord prescription. The independent vector reference uses the literal scalar-opacity prescription. These transport conventions are not automatically equivalent. See the calculation report and VALIDATION_AND_REVIEW.md.

          Numerical convergence and software consistency are not physical validation. The unshaded area is not a demonstrated globally allowed region.
          """
          files["PACKAGE_README.md"] = readme.encode()
          files["requirements-review.txt"] = (
              "# Direct Python dependencies inferred from source imports; versions unpinned because no lockfile was archived.\n"
              "numpy\nscipy\nmatplotlib\nPyMuPDF\n"
          ).encode()

          manifest_lines = []
          for name in sorted(files):
              data = files[name]
              manifest_lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}  bytes={len(data)}")
          files["SHA256SUMS.txt"] = ("\n".join(manifest_lines) + "\n").encode()

          out = Path("dist/axial_stellar_constraints_review_package.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for name in sorted(files):
                  zf.writestr(name, files[name])
          with zipfile.ZipFile(out, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f"Master ZIP CRC failure: {bad}")
          print(json.dumps({
              "file_count": len(files),
              "archive": str(out),
              "archive_bytes": out.stat().st_size,
              "archive_sha256": hashlib.sha256(out.read_bytes()).hexdigest(),
          }, indent=2))
          PY

      - name: Upload consolidated review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: axial-stellar-constraints-review-package
          path: dist/axial_stellar_constraints_review_package.zip
          if-no-files-found: error
          retention-days: 30
