name: Polarization transport prescription comparison

on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/analyze_transport_prescription.py'
      - '.github/workflows/transport-prescription-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transport-prescription-audit
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Analyze transport prescriptions
        run: |
          python research/stellar-cooling-constraints-20261105/analyze_transport_prescription.py \
            --input research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json \
            --output research/stellar-cooling-constraints-20261105/outputs/vector_audit/transport_prescription_comparison.json
      - name: Commit transport comparison
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/outputs/vector_audit/transport_prescription_comparison.json
          if git diff --cached --quiet; then
            echo "Transport comparison is already current."
          else
            git commit -m "Archive polarization transport prescription comparison"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry \${attempt}/5."
              sleep 2
            done
            echo "Could not archive transport comparison after five retries."
            exit 1
          fi
