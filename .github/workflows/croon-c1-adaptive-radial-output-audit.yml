name: Croon C1 adaptive radial output audit

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-c1-adaptive-radial-output-audit.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_croon_c1_adaptive_radial_output_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_2026-11-20.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_2026-11-20.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_c1_adaptive_radial_2026-11-20.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  c1-adaptive-radial-output-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned post-processing dependency
        run: python -m pip install numpy==2.5.5
      - name: Recompute both-boundary radial convergence from archived outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: python audit_croon_c1_adaptive_radial_output_convergence.py
      - name: Validate complete radial convergence report
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json")
          d = json.loads(p.read_text())
          r = d["radial_grid_convergence"]
          assert d["status"].startswith("PASS:")
          assert r["coarse_radial_points"] == 103
          assert r["fine_radial_points"] == 153
          assert r["coupling_points"] == 121
          assert r["one_percent_target_met"] is True
          assert r["all_boundaries_and_modes_below_0_12_percent"] is True
          assert r["max_relevant_pointwise_relative_difference_all_boundaries_and_modes"] < 0.0012
          assert r["max_absolute_difference_over_curve_peak_all_boundaries_and_modes"] < 0.01
          assert r["max_QUADPACK_relative_error_estimate_both_grids"] < 1e-6
          assert r["max_three_mode_closure_residual_both_grids"] < 1e-12
          assert r["surface_asymptote_103_vs_153_relative_difference"] < 1e-6
          assert r["checksum_manifest_verified"] is True
          print("Both-boundary C1 adaptive radial output audit: PASS")
          print("maximum relevant pointwise difference:", r["max_relevant_pointwise_relative_difference_all_boundaries_and_modes"])
          print("maximum absolute difference / curve peak:", r["max_absolute_difference_over_curve_peak_all_boundaries_and_modes"])
          PY
      - name: Create report checksum
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum outputs/C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json \
            > outputs/SHA256SUMS_C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.txt
      - name: Upload independently audited convergence report
        uses: actions/upload-artifact@v4
        with:
          name: croon-c1-adaptive-radial-output-audit-2026-11-20
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.txt
          if-no-files-found: error
      - name: Commit updated two-boundary convergence report
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_C1_RNU_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive complete C1 two-boundary radial convergence audit"
            for attempt in 1 2 3; do
              git fetch origin "research/croon-vector-benchmark-and-rate-corrections-20261119"
              git rebase "origin/research/croon-vector-benchmark-and-rate-corrections-20261119"
              if git push origin "HEAD:research/croon-vector-benchmark-and-rate-corrections-20261119"; then
                exit 0
              fi
            done
            exit 1
          fi
