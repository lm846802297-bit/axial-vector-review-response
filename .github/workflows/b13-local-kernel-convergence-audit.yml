name: B.13 local moving-muon kernel quadrature convergence

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b13-local-kernel-convergence-audit.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_local_kernel_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b13-local-kernel-convergence-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-kernel-audit:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Run exact moving-muon kernel regression tests
        run: |
          export PYTHONPATH="research/stellar-cooling-constraints-20261105:research/stellar-cooling-constraints-20261105/finite_mixing"
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -p 'test_thermal_rates.py' -v

      - name: Run high-order local B.13 kernel convergence audit
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_local_kernel_convergence.py \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_local_kernel_quadrature_convergence_10mev_2026-11-09.json

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Archive machine-readable local kernel audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_local_kernel_quadrature_convergence_10mev_2026-11-09.json
          if git diff --cached --quiet; then
            echo "B.13 local kernel convergence output is already current."
          else
            git commit -m "Archive B.13 local kernel quadrature convergence"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry ${attempt}/5."
              sleep 2
            done
            echo "Could not archive the B.13 local kernel convergence output after five retries."
            exit 1
          fi
