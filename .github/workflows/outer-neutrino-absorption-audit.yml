name: Outer neutrino absorption audit

on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_outer_neutrino_absorption.py'
      - '.github/workflows/outer-neutrino-absorption-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outer-neutrino-absorption-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Run outer neutrino absorption audit
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_outer_neutrino_absorption.py
      - name: Commit machine-readable audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/outer_neutrino_absorption_audit.json
          if git diff --cached --quiet; then
            echo "Outer neutrino absorption audit is unchanged."
          else
            git commit -m "Archive outer neutrino absorption audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
