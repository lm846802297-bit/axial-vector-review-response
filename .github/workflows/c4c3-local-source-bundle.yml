name: C4C3 local source bundle

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/c4c3-local-source-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bundle source and exact C1/C2 inputs for local execution
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/c4c3-source"
          mkdir -p "$ROOT"
          find research/stellar-cooling-constraints-20261105 -type f -name '*.py' -print0 |
            while IFS= read -r -d '' file; do
              mkdir -p "$ROOT/$(dirname "$file")"
              cp "$file" "$ROOT/$file"
            done
          for file in \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_full_0p05km_2026-11-11.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_full_radial_occupation_2026-11-11.csv; do
            mkdir -p "$ROOT/$(dirname "$file")"
            cp "$file" "$ROOT/$file"
          done
          printf '%s\n' "${{ github.sha }}" > "$ROOT/SOURCE_COMMIT_SHA.txt"
          printf '%s\n' "profile_git_blob_sha=9ff7818b0679992c0a9ba402330ec7f0d1f3041b" >> "$ROOT/SOURCE_MANIFEST.txt"
          printf '%s\n' "c2_occupation_git_blob_sha=c472040a4551e68ffadbf7addf9402663f99e7e3" >> "$ROOT/SOURCE_MANIFEST.txt"
          tar -C "$ROOT" -czf "$RUNNER_TEMP/c4c3-local-source-bundle.tar.gz" .

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: c4c3-local-source-bundle
          path: ${{ runner.temp }}/c4c3-local-source-bundle.tar.gz
          if-no-files-found: error
          retention-days: 3
