name: P1-B 10 MeV B.13 local radial-energy convergence

on:
  push:
    branches:
      - research/fig7-10mev-transport-localization-20261113-v2
    paths:
      - .github/workflows/p1b-b13-local-kernel-radial-energy.yml
      - research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py
      - research/stellar-cooling-constraints-20261105/rates.py
      - research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py
      - research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - research/stellar-cooling-constraints-20261105/data/profile_provenance.json
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/audit_b13_local_kernel_radial_energy_10mev.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/test_p1b_b13_local_kernel_radial_energy_10mev.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1b-b13-local-radial-energy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-kernel-radial-energy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out triggering research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy

      - name: Compile local B.13 sources
        run: |
          python -m compileall -q \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/finite_mixing \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py

      - name: Run P1-B regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals \
            -t research/stellar-cooling-constraints-20261105 \
            -p 'test_p1b_b13_local_kernel_radial_energy_10mev.py' -v

      - name: Run dense 10 MeV radial-energy audit
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/audit_b13_local_kernel_radial_energy_10mev.py \
            --profile research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/p1b_b13_local_kernel_radial_energy_10mev_2026-11-13.json

      - name: Publish numerical summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/p1b_b13_local_kernel_radial_energy_10mev_2026-11-13.json")
          if not path.exists():
              print("P1-B JSON output was not produced.")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          a = data["acceptance"]
          lines = [
              "# P1-B 10 MeV B.13 local-kernel audit",
              "",
              f"- Overall P1-B: **{'PASS' if a['overall_p1b_pass'] else 'NOT PASSED'}**",
              f"- Quadrature: {'PASS' if a['quadrature_pass'] else 'NOT PASSED'}; max final change = {a['maximum_grid_node_final_refinement_change']:.6e} (grid), {a['maximum_cell_midpoint_final_refinement_change']:.6e} (midpoints)",
              f"- Radial-energy interpolation: {'PASS' if a['interpolation_pass'] else 'NOT PASSED'}; max midpoint error = {a['maximum_direct_midpoint_vs_bilinear_log_interpolation_error']:.6e}",
              f"- Detailed balance: {'PASS' if a['detailed_balance_pass'] else 'NOT PASSED'}; max residual = {a['maximum_mode_detailed_balance_relative_residual']:.6e}",
              f"- Final-muon shell: {'PASS' if a['mass_shell_pass'] else 'NOT PASSED'}; max residual = {a['maximum_final_muon_mass_shell_relative_error']:.6e}",
              f"- Finite/nonnegative rates: **{'PASS' if a['finite_nonnegative_rates_pass'] else 'NOT PASSED'}**",
              "",
              f"- Grid nodes: {data['grid']['grid_node_count']}",
              f"- Radial-energy cell midpoints: {data['grid']['radial_energy_cell_midpoint_count']}",
              f"- Runtime: {data['runtime_seconds']:.1f} s",
          ]
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Enforce numerical acceptance
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/p1b_b13_local_kernel_radial_energy_10mev_2026-11-13.json")
          data = json.loads(path.read_text())
          if not data["acceptance"]["overall_p1b_pass"]:
              raise SystemExit("P1-B numerical screening did not pass; inspect the archived JSON artifact.")
          print("P1-B numerical screening passed.")
          PY

      - name: Upload complete P1-B numerical record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1b-b13-local-radial-energy-10mev
          path: research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/p1b_b13_local_kernel_radial_energy_10mev_2026-11-13.json
          if-no-files-found: warn
          retention-days: 90
