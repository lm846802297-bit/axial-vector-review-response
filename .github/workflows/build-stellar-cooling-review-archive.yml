name: Build stellar-cooling collaborator archive

on:
  push:
    branches:
      - research/stellar-cooling-collaborator-archive-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned research snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/stellar-cooling-collaborator-archive-20261113/requirements-review.txt

      - name: Run axial core tests
        run: |
          pytest -q research/stellar-cooling-constraints-20261105             --ignore=research/stellar-cooling-constraints-20261105/blinov_reproduction

      - name: Run model-variant mapping tests
        run: |
          python -m unittest discover -s research/stellar-cooling-original-uv-model-20261105 -p "test_*.py" -v
          python -m unittest discover -s research/stellar-cooling-two-vev-20261105 -p "test_*.py" -v

      - name: Smoke-test shared thermal adapters against both local matrix elements
        run: |
          python research/stellar-cooling-original-uv-model-20261105/stellar_semi_compton_thermal_rate.py --check
          python research/stellar-cooling-two-vev-20261105/stellar_semi_compton_thermal_rate.py --check

      - name: Validate saved axial outputs
        run: |
          python research/stellar-cooling-constraints-20261105/validate_outputs.py

      - name: Generate log-log contour review and interpolation audit
        run: |
          python research/stellar-cooling-constraints-20261105/plot_constraints_loglog.py \
            --output-dir dist/reviewed-loglog-figures

      - name: Build deduplicated collaborator ZIP
        run: |
          python research/stellar-cooling-collaborator-archive-20261113/build_archive.py \
            --output dist/Stellar_Cooling_Research_Archive_2026-11-13.zip \
            --generated-figures dist/reviewed-loglog-figures

      - name: Upload collaborator ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Stellar_Cooling_Research_Archive_2026-11-13
          path: dist/Stellar_Cooling_Research_Archive_2026-11-13.zip
          if-no-files-found: error
          retention-days: 30
