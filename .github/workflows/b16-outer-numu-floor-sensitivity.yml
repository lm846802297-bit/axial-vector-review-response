name: B.16 outer 20-22 km muon-neutrino floor sensitivity

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_outer_numu_floor_sensitivity.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - '.github/workflows/b16-outer-numu-floor-sensitivity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-outer-numu-floor-sensitivity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sensitivity:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run self-consistent B.1 and B.2 mu_numu floor sensitivity
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_outer_numu_floor_sensitivity.py --mass 10 --nr 40 --ne 100 --na 32 --ns 32
      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- research/stellar-cooling-constraints-20261105/rates.py research/stellar-cooling-constraints-20261105/transport.py research/stellar-cooling-constraints-20261105/outputs/axial.json research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive sensitivity output and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_outer_numu_floor_sensitivity_20_22km_10mev_2026-11-09.json
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/B16_OUTER_NUMU_FLOOR_SENSITIVITY_20_22KM_2026-11-09.md
          if git diff --cached --quiet; then
            echo "Outer mu_numu floor sensitivity result is already current."
          else
            git commit -m "Archive B.16 outer muon-neutrino floor sensitivity"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                exit 0
              fi
              echo "Push raced with another research workflow; retry ${attempt}/5."
              sleep 2
            done
            echo "Could not archive outer mu_numu floor sensitivity after five retries."
            exit 1
          fi
