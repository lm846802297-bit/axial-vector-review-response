name: One-time extraction of generated archive containers

on:
  push:
    branches:
      - chore/extract-generated-archives-20261113

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean main-based branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: repo
          fetch-depth: 0

      - name: Check out pinned review-package source
        uses: actions/checkout@v4
        with:
          ref: 48bbe212d9a239b9e23bc45d455302b1f8fdcec1
          path: source-package
          fetch-depth: 1

      - name: Extract and verify native files; remove containers
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path("repo")
          source = Path("source-package")
          calc_rel = Path("research/stellar-cooling-constraints-20261105")
          calc = repo / calc_rel

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def safe_path(name):
              path = PurePosixPath(name)
              if path.is_absolute() or not path.parts or ".." in path.parts or chr(92) in name:
                  raise RuntimeError("Unsafe archive path: " + repr(name))
              return path

          def extract_zip(payload, destination, label, expected=None):
              records = []
              seen = set()
              with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(label + ": CRC failure in " + bad)
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      rel = safe_path(info.filename)
                      key = rel.as_posix()
                      if key in seen:
                          raise RuntimeError(label + ": duplicate member " + key)
                      seen.add(key)
                      data = archive.read(info)
                      target = destination.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if target.exists():
                          raise RuntimeError(label + ": output collision " + str(target))
                      target.write_bytes(data)
                      records.append({"path": key, "bytes": len(data), "sha256": digest(data)})
              if expected is not None:
                  actual = {item["path"]: item["sha256"] for item in records}
                  if set(actual) != set(expected):
                      raise RuntimeError(label + ": embedded manifest path mismatch")
                  for name, value in expected.items():
                      if actual[name] != value:
                          raise RuntimeError(label + ": SHA-256 mismatch for " + name)
              nested = [str(p) for p in destination.rglob("*") if p.is_file() and p.suffix.lower() == ".zip"]
              if nested:
                  raise RuntimeError(label + ": nested ZIPs remain: " + repr(nested))
              return records

          def write_checksums(directory):
              lines = []
              files = sorted(p for p in directory.rglob("*") if p.is_file()
                             and p.name not in {"SHA256SUMS.txt", "PACKAGE_EXTRACTION_MANIFEST.json"})
              for path in files:
                  data = path.read_bytes()
                  lines.append(digest(data) + "  " + path.relative_to(directory).as_posix()
                               + "  bytes=" + str(len(data)))
              (directory / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
              return lines

          # A. Overleaf: verify archive bytes and every embedded file hash.
          overleaf_zip = repo / "Overleaf_Reply_Letter_PR72_2026-11-13.zip"
          overleaf_sum = repo / "Overleaf_Reply_Letter_PR72_2026-11-13.SHA256SUMS.txt"
          overleaf_bytes = overleaf_zip.read_bytes()
          external = overleaf_sum.read_text(encoding="utf-8")
          archive_size = None
          archive_hash = None
          expected = {}
          for line in external.splitlines():
              if line.startswith("# archive_size_bytes="):
                  archive_size = int(line.split("=", 1)[1])
              elif line.startswith("# archive_sha256="):
                  archive_hash = line.split("=", 1)[1].strip()
              else:
                  fields = line.split()
                  if len(fields) >= 2 and fields[1].startswith("embedded:"):
                      expected[fields[1][len("embedded:"):]] = fields[0]
          if len(overleaf_bytes) != archive_size or digest(overleaf_bytes) != archive_hash:
              raise RuntimeError("Overleaf archive size/SHA-256 mismatch")
          overleaf_out = repo / "deliverables/Overleaf_Reply_Letter_PR72_2026-11-13"
          overleaf_records = extract_zip(overleaf_bytes, overleaf_out, "Overleaf package", expected)
          (overleaf_out / "EXTRACTION_PROVENANCE.md").write_text(
              "# Overleaf package extraction provenance\n\n"
              "- Original archive: Overleaf_Reply_Letter_PR72_2026-11-13.zip (removed after extraction)\n"
              + "- Original archive bytes: " + str(len(overleaf_bytes)) + "\n"
              + "- Original archive SHA-256: " + digest(overleaf_bytes) + "\n"
              + "- Source-main revision in original manifest: 3a3e8bb0eeb54a627cf2b2df315edf8badfe1dc8\n"
              + "- Verification: archive size, archive SHA-256, ZIP CRC, and every embedded file SHA-256 matched.\n"
              + "- All files are committed individually; no ZIP container is retained.\n",
              encoding="utf-8",
          )
          write_checksums(overleaf_out)

          # B. Higgs-portal document handoff: extract files and checksum them.
          higgs_zip = repo / "higgs_portal_mixing_md_with_svg.zip"
          higgs_bytes = higgs_zip.read_bytes()
          higgs_out = repo / "deliverables/higgs_portal_mixing_md_with_svg"
          higgs_records = extract_zip(higgs_bytes, higgs_out, "Higgs portal package")
          (higgs_out / "EXTRACTION_PROVENANCE.md").write_text(
              "# Higgs-portal document package extraction provenance\n\n"
              "- Original archive: higgs_portal_mixing_md_with_svg.zip (removed after extraction)\n"
              + "- Original archive bytes: " + str(len(higgs_bytes)) + "\n"
              + "- Original archive SHA-256: " + digest(higgs_bytes) + "\n"
              + "- ZIP CRC checked; extracted-file hashes are listed in SHA256SUMS.txt.\n"
              + "- All files are committed individually; no ZIP container is retained.\n",
              encoding="utf-8",
          )
          write_checksums(higgs_out)

          # C. Axial stellar review package: extract the 12 non-overlapping parts
          #    selected by the original packager; omit redundant aggregate wrappers.
          parts_dir = source / calc_rel / "review_package_parts"
          part_names = [
              "01_sources_profile_report.zip.b64",
              "02A1_axial_scan.zip.b64",
              "02A2_vector_scan.zip.b64",
              "02A3_endpoint_validation.zip.b64",
              "02B1_convergence_refinements.zip.b64",
              "02B2a_profile_sensitivity.zip.b64",
              "02B2b_coupling_and_vector_audit.zip.b64",
              "03A_figures_mev_and_wide.zip.b64",
              "03B_figures_gev_and_luminosity_png.zip.b64",
              "04A_source_tests_reference.zip.b64",
              "04B_reference_diagnostics_and_audits.zip.b64",
              "04C_reference_helpers.zip.b64",
          ]
          review_out = calc / "review_package_extracted"
          review_out.mkdir(parents=True, exist_ok=False)
          source_parts = []
          member_records = []
          seen = set()
          for part_name in part_names:
              encoded = (parts_dir / part_name).read_bytes()
              payload = base64.b64decode(encoded.decode("ascii"), validate=True)
              stem = part_name.removesuffix(".zip.b64")
              local_records = []
              with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
                  bad = archive.testzip()
                  if bad:
                      raise RuntimeError(part_name + ": CRC failure in " + bad)
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      name = info.filename
                      if name == "PART_README.txt":
                          name = "package_metadata/part_" + stem + "_README.txt"
                      elif name.startswith("SHA256") or name.startswith("GIT_BLOB"):
                          name = "package_metadata/part_" + stem + "_" + name
                      elif name.startswith("source/"):
                          name = name[len("source/"):]
                      elif name.startswith("reports/"):
                          name = name[len("reports/"):]
                      rel = safe_path(name)
                      key = rel.as_posix()
                      if key in seen:
                          raise RuntimeError("Duplicate review-package member: " + key)
                      seen.add(key)
                      data = archive.read(info)
                      target = review_out.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      record = {"path": key, "bytes": len(data), "sha256": digest(data)}
                      local_records.append(record)
                      member_records.append(record)
              source_parts.append({
                  "name": part_name,
                  "encoded_text_bytes": len(encoded),
                  "encoded_text_sha256": digest(encoded),
                  "decoded_zip_bytes": len(payload),
                  "decoded_zip_sha256": digest(payload),
                  "member_count": len(local_records),
              })

          source_report = source / calc_rel / "AXIAL_STELLAR_CONSTRAINTS_CALCULATION_AND_REVIEW_2026-11-13.md"
          if not source_report.is_file():
              raise RuntimeError("Pinned source branch lacks the full calculation/review report")
          shutil.copyfile(source_report, review_out / source_report.name)
          original_readme = parts_dir / "README.md"
          if original_readme.is_file():
              metadata = review_out / "package_metadata"
              metadata.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(original_readme, metadata / "ORIGINAL_PACKAGE_PARTS_README.md")
          init_source = source / calc_rel / "blinov_reproduction" / "__init__.py"
          if init_source.is_file():
              init_target = review_out / "blinov_reproduction" / "__init__.py"
              init_target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(init_source, init_target)

          readme = """# Axial stellar-cooling review package — extracted files

          This directory is an individually extracted, checksum-verified review snapshot. No ZIP or Base64 archive container is required.

          ## Provenance
          - Repository: lm846802297-bit/axial-vector-review-response
          - Numerical source baseline: 81d9b2faf16eb39879b759b05afce46732c925d7
          - Source branch: research/stellar-cooling-review-package-20261113
          - Source commit: 48bbe212d9a239b9e23bc45d455302b1f8fdcec1
          - Profile inputs are reconstructed from public paper figures; no restricted Garching raw simulation tables are included.

          ## Contents
          Production axial EFT rates, transport, scan, profile, plotting and validation code; reconstructed SFHo-18.8 profile and provenance; axial/vector/endpoint scans; convergence/refinement/sensitivity outputs; numerical validation JSON; figures; independent literal Blinov vector reference implementation and comparison inputs; tests and detailed-balance/equation-chain/profile/opacity diagnostics; and the full calculation/review report.

          ## Reproduction
          Python 3 with NumPy, SciPy and Matplotlib is required. Profile extraction additionally requires PyMuPDF. No version-pinned environment lockfile was present.

          From the repository root, run:
          python -m unittest discover -s research/stellar-cooling-constraints-20261105/review_package_extracted -p "test_*.py" -v
          python research/stellar-cooling-constraints-20261105/review_package_extracted/run_scan.py --mass-count 68 --nr 88 --ne 180 --na 24 --ns 64 --nc 40 --gmax 1e-3 --gcount 301 --output research/stellar-cooling-constraints-20261105/review_package_extracted/outputs/axial_reproduced.json
          python research/stellar-cooling-constraints-20261105/review_package_extracted/run_scan.py --mass-count 68 --nr 88 --ne 180 --na 24 --ns 64 --nc 40 --current vector --gmax 1e-3 --gcount 301 --output research/stellar-cooling-constraints-20261105/review_package_extracted/outputs/vector_reproduced.json
          python research/stellar-cooling-constraints-20261105/review_package_extracted/validate_outputs.py
          python research/stellar-cooling-constraints-20261105/review_package_extracted/plot_constraints.py

          ## Scientific status
          This is a reproducible fixed-profile ballistic-cooling benchmark, not a final SN1987A exclusion. The pure-vector Blinov Fig. 7 validation gate remains NOT PASSED at the 10 MeV strong-absorption tail. Numerical convergence and software consistency are not physical validation; the unshaded area is not a demonstrated globally allowed region.

          The original package README and per-part SHA-256/Git-blob records are preserved in package_metadata/. See PACKAGE_EXTRACTION_MANIFEST.json and SHA256SUMS.txt for exact extraction provenance and file hashes.
          """
          (review_out / "README.md").write_text(readme, encoding="utf-8")
          (review_out / "requirements-review.txt").write_text(
              "# Direct dependencies inferred from source imports; versions intentionally unpinned.\n"
              "numpy\nscipy\nmatplotlib\nPyMuPDF\n",
              encoding="utf-8",
          )
          package_manifest = {
              "prepared": "2026-11-13",
              "repository": "lm846802297-bit/axial-vector-review-response",
              "source_branch": "research/stellar-cooling-review-package-20261113",
              "source_commit": "48bbe212d9a239b9e23bc45d455302b1f8fdcec1",
              "numerical_source_baseline": "81d9b2faf16eb39879b759b05afce46732c925d7",
              "policy": "Archive containers were decoded and extracted; only native files are committed.",
              "source_parts": source_parts,
              "archive_members": sorted(member_records, key=lambda item: item["path"]),
          }
          (review_out / "PACKAGE_EXTRACTION_MANIFEST.json").write_text(
              json.dumps(package_manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          write_checksums(review_out)

          # Final guard: generated handoff directories contain no ZIP or Base64 files.
          for directory in (overleaf_out, higgs_out, review_out):
              leftovers = [str(p) for p in directory.rglob("*") if p.is_file()
                           and (p.suffix.lower() == ".zip" or p.name.endswith(".b64"))]
              if leftovers:
                  raise RuntimeError("Archive containers remain: " + repr(leftovers))

          # Remove only generated handoff archives. Official SFHo/FRDM upstream
          # source archives are intentionally untouched pending a separate data-reader migration.
          overleaf_zip.unlink()
          overleaf_sum.unlink()
          higgs_zip.unlink()
          (repo / ".github/workflows/extract-generated-archives.yml").unlink()

          print(json.dumps({
              "overleaf": {"files": len(overleaf_records), "bytes": sum(x["bytes"] for x in overleaf_records), "archive_sha256": digest(overleaf_bytes)},
              "higgs": {"files": len(higgs_records), "bytes": sum(x["bytes"] for x in higgs_records), "archive_sha256": digest(higgs_bytes)},
              "stellar_review": {"members": len(member_records), "bytes": sum(x["bytes"] for x in member_records), "source_parts": source_parts},
          }, indent=2))
          PY

          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract review packages into native files; remove ZIP containers"
          git push origin "HEAD:$GITHUB_REF_NAME"
