name: Fig. 7 10 MeV equation-chain audit

on:
  push:
    branches:
      - research/b16-energy-grid-diagnostic-20261117
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_fig7_10mev_equation_chain.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
      - 'research/stellar-cooling-constraints-20261105/outputs/vector_audit/luminosity_comparison.json'
      - '.github/workflows/fig7-10mev-equation-chain-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fig7-10mev-equation-chain-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  equation-chain-audit:
    if: github.ref == 'refs/heads/research/b16-energy-grid-diagnostic-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.4 scipy==1.18.1
      - name: Run the fixed 10 MeV equation-chain diagnostic
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/diagnose_fig7_10mev_equation_chain.py
      - name: Validate output identity and scope
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig7_10mev_equation_chain_audit.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "diagnostic_only_no_physical_rescaling"
          assert data["mass_MeV"] == 10.0
          assert data["profile_sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert data["quadrature"] == {"radial_order": 88, "energy_order": 180, "angular_order": 24, "path_order": 64, "energy_offset_MeV": 1000.0, "radius_km": 25.0}
          assert len(data["three_curve_points"]) == 3
          assert data["eq20"]["stable_reduced_absorption_max_relative_residual"] < 1e-10
          assert data["eq31_33"]["compton_rate_reconstruction_max_relative_residual"] < 1e-10
      - name: Upload machine-readable diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: fig7-10mev-equation-chain-audit
          path: research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig7_10mev_equation_chain_audit.json
          if-no-files-found: error

  archive-result:
    needs: equation-chain-audit
    if: needs.equation-chain-audit.result == 'success' && github.ref == 'refs/heads/research/b16-energy-grid-diagnostic-20261117'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the validated diagnostic
        uses: actions/download-artifact@v4
        with:
          name: fig7-10mev-equation-chain-audit
          path: /tmp/fig7-10mev-equation-chain-audit
      - name: Commit validated JSON with race-safe branch synchronization
        shell: bash
        run: |
          set -euo pipefail
          target="research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/fig7_10mev_equation_chain_audit.json"
          artifact="/tmp/fig7-10mev-equation-chain-audit/fig7_10mev_equation_chain_audit.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "refs/heads/research/b16-energy-grid-diagnostic-20261117"
            git reset --hard "origin/research/b16-energy-grid-diagnostic-20261117"
            cp "$artifact" "$target"
            git add "$target"
            if git diff --cached --quiet; then
              echo "Diagnostic JSON is already current on the latest branch tip."
              exit 0
            fi
            git commit -m "Archive validated 10 MeV equation-chain diagnostic"
            if git push origin "HEAD:refs/heads/research/b16-energy-grid-diagnostic-20261117"; then
              exit 0
            fi
            echo "Concurrent branch update detected; retrying from latest branch tip ($attempt/5)."
          done
          echo "Could not archive after five branch-sync attempts."
          exit 1
