name: Moving-muon thermal response

on:
  workflow_dispatch:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_dimuon.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/test_thermal_rates.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_response_scan.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/test_b13_b16_comparison.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/b13_b16_comparison.py
      - .github/workflows/moving-muon-thermal-rates.yml
  pull_request:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_dimuon.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/test_thermal_rates.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/thermal_response_scan.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/test_b13_b16_comparison.py
      - research/stellar-cooling-constraints-20261105/finite_mixing/b13_b16_comparison.py
      - .github/workflows/moving-muon-thermal-rates.yml

permissions:
  contents: write

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out research head branch
        uses: actions/checkout@v4
        with:
          ref: research/moving-muon-thermal-rates-20261107
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --upgrade numpy
      - name: Run finite-mixing and thermal-rate tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -t research/stellar-cooling-constraints-20261105 \
            -p 'test_*.py' -v
      - name: Run local thermal response scan
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_response_scan.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/outputs/thermal_response_scan.json
      - name: Run exact B.13 vs B.14--B.16 local comparison
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/b13_b16_comparison.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/outputs/b13_b16_comparison_2026-11-08.json
      - name: Commit reproducible numerical output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/finite_mixing/outputs/thermal_response_scan.json research/stellar-cooling-constraints-20261105/finite_mixing/outputs/b13_b16_comparison_2026-11-08.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive moving-muon thermal response scan"
            git push origin HEAD:research/moving-muon-thermal-rates-20261107
          fi
