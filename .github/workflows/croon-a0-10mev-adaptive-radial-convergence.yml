name: Croon A0 10 MeV adaptive radial convergence

on:
  push:
    branches:
      - research/croon-vector-benchmark-and-rate-corrections-20261119
    paths:
      - '.github/workflows/croon-a0-10mev-adaptive-radial-convergence.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_croon_a0_10mev_adaptive_radial_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_a0_uv_axial_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/croon_c1_b13_vector_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_a0_uv_axial_transport_10mev_2026-11-20.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_c1_b13_vector_transport_10mev_adaptive_radial_153nodes_2026-11-20.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  a0-adaptive-radial-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record source revision and profile identity
        run: |
          python --version
          git rev-parse HEAD
          sha256sum research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==2.5.5 scipy==1.18.1
      - name: Run A0 and C1 kernel regression tests
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: |
          python -m unittest -v \
            test_croon_a0_uv_axial_transport.py \
            test_croon_c1_b13_vector_transport.py
      - name: Compute independent 153-node A0 adaptive radial refinement
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        env:
          PYTHONPATH: ..
        run: python audit_croon_a0_10mev_adaptive_radial_convergence.py
      - name: Validate A0 radial convergence and B.7 closure
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/A0_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json")
          d = json.loads(p.read_text())
          assert d["status"] == "PASS", d
          assert d["baseline"]["radial_points"] == 103
          assert d["refined"]["radial_points"] == 153
          assert d["refined"]["energy_order"] == 32
          assert d["fixed_parameters"]["adaptive_radial"] is True
          assert d["B7_unchanged_against_C1_153node"]["total_relative_difference"] < 1e-12
          assert max(d["B7_unchanged_against_C1_153node"]["per_mode_relative_differences"].values()) < 1e-12
          assert d["max_quadpack_relative_error_estimate"] < 1e-6
          assert d["max_mode_sum_relative_residual"] < 1e-12
          assert max(d["surface_asymptote_high_g_relative_residuals"].values()) < 1e-6
          assert d["detailed_balance"]["max_B7_mode_residual"] < 1e-10
          assert d["detailed_balance"]["max_B13_charge_mode_residual"] < 1e-10
          assert d["detailed_balance"]["max_final_muon_shell_relative_error"] < 2e-10
          print("A0 103/153-node adaptive radial convergence: PASS")
          print("maximum radial change metric:", d["maximum_radial_change_metric"])
          print("B.7 unchanged against C1:", d["B7_unchanged_against_C1_153node"])
          print("maximum QUADPACK error:", d["max_quadpack_relative_error_estimate"])
          PY
      - name: Create SHA-256 manifest for A0 adaptive radial outputs
        working-directory: research/stellar-cooling-constraints-20261105/blinov_reproduction
        run: |
          sha256sum \
            outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.json \
            outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.csv \
            outputs/A0_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json \
            > outputs/SHA256SUMS_croon_a0_adaptive_radial_convergence_2026-11-20.txt
      - name: Upload native A0 radial convergence outputs
        uses: actions/upload-artifact@v4
        with:
          name: croon-a0-10mev-adaptive-radial-convergence-2026-11-20
          path: |
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.csv
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/A0_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_a0_adaptive_radial_convergence_2026-11-20.txt
          if-no-files-found: error
      - name: Commit A0 radial convergence outputs to the research branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/croon_a0_uv_axial_transport_10mev_153nodes_adaptive_2026-11-20.csv \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/A0_10MEV_ADAPTIVE_RADIAL_CONVERGENCE_2026-11-20.json \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/SHA256SUMS_croon_a0_adaptive_radial_convergence_2026-11-20.txt
          if ! git diff --cached --quiet; then
            git commit -m "Archive A0 10 MeV adaptive radial convergence"
            for attempt in 1 2 3; do
              git fetch origin "research/croon-vector-benchmark-and-rate-corrections-20261119"
              git rebase "origin/research/croon-vector-benchmark-and-rate-corrections-20261119"
              if git push origin "HEAD:research/croon-vector-benchmark-and-rate-corrections-20261119"; then
                exit 0
              fi
            done
            exit 1
          fi
