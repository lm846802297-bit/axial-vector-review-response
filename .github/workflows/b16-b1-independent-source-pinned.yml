name: B16 independent B.1 thin-source pinned NumPy reproduction

on:
  push:
    branches:
      - maintenance/repository-organization-audit-20261114
    paths:
      - '.github/workflows/b16-b1-independent-source-pinned.yml'
      - 'research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_b1_independent.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/reference.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_global_fig7_vertex_preserving_10mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b16-b1-independent-source-pinned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-independent-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4

      - name: Require the reviewed maintenance branch
        run: |
          test "$GITHUB_REF" = "refs/heads/maintenance/repository-organization-audit-20261114"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'

      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/stellar-cooling-constraints-20261105/requirements-b16-audit.txt

      - name: Verify exact runtime
        run: |
          python - <<'PY'
          import sys, numpy, scipy
          assert sys.version_info[:3] == (3, 12, 14)
          assert numpy.__version__ == "2.5.4"
          assert scipy.__version__ == "1.18.1"
          print("Python:", sys.version)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          PY
          python -m pip freeze

      - name: Run independent B.1 quadrature unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_b1_independent.py' -v

      - name: Recompute full independent B.1 thin-source integral
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_b1_independent.py \
            --mass 10 --radius 25 --radial-order 4 --energy-order 4 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json

      - name: Verify B.1 provenance, quadrature convergence and measure closure
        run: |
          python - <<'PY'
          import json, math, re
          from pathlib import Path
          path = Path("research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json")
          d = json.loads(path.read_text())
          assert d.get("run_commit_sha")
          assert re.fullmatch(r"[0-9a-f]{64}", d.get("code_sha256", ""))
          assert d["profile"]["sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert re.fullmatch(r"[0-9a-f]{64}", d.get("baseline_reference_sha256", ""))
          c = d["configuration"]
          assert c["mass_MeV"] == 10.0 and c["radius_km"] == 25.0
          assert c["radial_order_per_panel"] == 4 and c["energy_gauss_order"] == 4
          assert c["final_radial_panels"] == 100
          assert c["final_energy_panels"] == 240 and c["final_energy_offset_MeV"] == 2000.0
          assert len(d["radial_convergence"]) == 3
          assert len(d["energy_convergence"]) == 4
          assert len(d["high_energy_tail_convergence"]) == 4
          assert abs(d["closure"]["sum_of_channels_relative_difference"]) < 1e-12
          assert d["closure"]["dimuon_channel_expected_closed_for_10MeV"] is True
          assert d["closure"]["dimuon_channel_value"] == 0.0
          matched = d["same_radial_grid_independent_energy_check"]
          assert matched["number_of_radial_nodes"] == 40
          assert abs(matched["comparison_with_archived"]["total"]["relative_difference"]) < 0.01
          assert abs(d["radial_convergence"][-2]["relative_difference_vs_100_panel_result"]) < 3e-5
          assert all(abs(x["relative_difference_vs_240_panel_result"]) < 1e-10 for x in d["energy_convergence"])
          assert abs(d["high_energy_tail_convergence"][1]["relative_difference_vs_4000MeV_offset"]) < 1e-7
          for channel in ("neutrino", "dimuon", "compton", "total"):
              residual = d["local_vs_infinity_energy_variable_comparison"][channel]["relative_difference"]
              assert residual is not None and abs(residual) < 5e-4, (channel, residual)
          final = d["final_independent_b1_source"]
          assert final["total_erg_s_per_g2"] > 0.0
          assert abs(d["comparison_with_archived_b16_b1"]["total"]["relative_difference"]) < 0.01
          assert d["production_axial_outputs_modified"] is False
          def check_finite(value):
              if isinstance(value, float):
                  assert math.isfinite(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      check_finite(item)
              elif isinstance(value, list):
                  for item in value:
                      check_finite(item)
          check_finite(d)
          print(json.dumps({
              "archived_comparison": d["comparison_with_archived_b16_b1"],
              "same_radial_energy_comparison": matched["comparison_with_archived"],
              "radial_convergence": d["radial_convergence"],
              "energy_convergence": d["energy_convergence"],
              "high_energy_tail_convergence": d["high_energy_tail_convergence"],
              "local_vs_infinity_energy_variable": d["local_vs_infinity_energy_variable_comparison"],
              "closure": d["closure"],
          }, indent=2))
          PY

      - name: Verify production axial outputs remain unchanged
        run: |
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png

      - name: Save pinned B.1 output to the reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b16_b1_independent_thin_source_10mev_2026-11-15_numpy_pinned.json
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "results(b16): archive pinned independent B1 source integral"
            git push origin HEAD:maintenance/repository-organization-audit-20261114
          fi
