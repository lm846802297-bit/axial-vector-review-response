name: Vector-to-axial local response scan
on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/**'
      - '!research/stellar-cooling-constraints-20261105/finite_mixing/outputs/**'
      - '!research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/**'
      - 'research/stellar-cooling-constraints-20261105/rates.py'
      - 'research/stellar-cooling-eft-literature-20261105/reference_matrix_element.py'
      - '.github/workflows/vector-axial-response-scan.yml'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: vector-axial-response-scan-${{ github.ref }}
  # Do not publish results from a superseded code revision.
  cancel-in-progress: true
jobs:
  response-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run finite-mixing and response tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-eft-literature-20261105
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -t research/stellar-cooling-constraints-20261105 \
            -p 'test_*.py' -v
      - name: Generate local response scan
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/response_scan.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/outputs/vector_axial_response_scan.json
      - name: Generate dimuon thermal-integral validation
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_dimuon_validation.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/dimuon_thermal_integral_validation.json
      - name: Generate moving-muon semi-Compton validation
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_moving_compton_validation.py
      - name: Generate SFHo local moving-Compton rate map
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_sfho_local_compton_map.py
      - name: Commit reproducible numerical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/finite_mixing/outputs/vector_axial_response_scan.json
          git add research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/dimuon_thermal_integral_validation.json
          git add research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/sfho188_local_compton_rates.json
          if git diff --cached --quiet; then
            echo "Response scan output is already current."
          else
            git commit -m "Archive vector-axial and thermal-integral validation scans"
            BRANCH="${GITHUB_REF_NAME}"
            for attempt in 1 2 3 4 5; do
              git fetch origin "$BRANCH"
              if ! git rebase "origin/$BRANCH"; then
                echo "Rebase conflict while archiving response scan outputs."
                exit 1
              fi
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi
              echo "Push raced with another workflow; retry ${attempt}/5."
              sleep 2
            done
            echo "Could not archive response scan outputs after five retries."
            exit 1
          fi
