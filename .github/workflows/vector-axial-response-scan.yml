name: Vector-to-axial local response scan
on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/**'
      - 'research/stellar-cooling-constraints-20261105/rates.py'
      - '.github/workflows/vector-axial-response-scan.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  response-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run finite-mixing and response tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/finite_mixing \
            -t research/stellar-cooling-constraints-20261105 \
            -p 'test_*.py' -v
      - name: Generate local response scan
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/response_scan.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/outputs/vector_axial_response_scan.json
      - name: Generate dimuon thermal-integral validation
        run: |
          python research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/run_dimuon_validation.py \
            --output research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/dimuon_thermal_integral_validation.json
      - name: Commit reproducible numerical output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/finite_mixing/outputs/vector_axial_response_scan.json
          git add research/stellar-cooling-constraints-20261105/finite_mixing/thermal_integrals/outputs/dimuon_thermal_integral_validation.json
          if git diff --cached --quiet; then
            echo "Response scan output is already current."
          else
            git commit -m "Archive vector-axial local response scan"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
