name: Referee response LaTeX build (PR55 and PR56)

on:
  push:
    branches:
      - review/response-point-conclusions-20261106
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'Replies_to_Referee_3_referee_facing_2026-11-04.tex'
      - 'Replies_to_Referee_3_neutrino_references.bib'
      - 'overleaf-source/axial-vector-model-building-v6/references.bib'
      - 'JHEP.bst'
      - 'Replies_to_Referee_3_stellar_references.bib'
      - 'research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints_reply.pdf'
      - '.github/workflows/pr55-referee-letter-build.yml'

permissions:
  contents: write

concurrency:
  group: referee-response-pdf-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-inspect:
    if: github.ref_name == 'review/response-point-conclusions-20261106' || github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers texlive-bibtex-extra poppler-utils ghostscript python3-pil

      - name: Refresh checkout to latest PR branch before compilation
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git fetch origin "$BRANCH"
          git reset --hard FETCH_HEAD

      - name: Compile with latexmk and BibTeX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pages build/review
          export BIBINPUTS="$GITHUB_WORKSPACE/overleaf-source/axial-vector-model-building-v6:$GITHUB_WORKSPACE:"
          export BSTINPUTS="$GITHUB_WORKSPACE:"
          latexmk -g -pdf -bibtex -interaction=nonstopmode -file-line-error -halt-on-error -outdir=build Replies_to_Referee_3_referee_facing_2026-11-04.tex 2>&1 | tee build/latexmk.log
          test -s build/Replies_to_Referee_3_referee_facing_2026-11-04.pdf
          test -s build/Replies_to_Referee_3_referee_facing_2026-11-04.bbl
          cp build/Replies_to_Referee_3_referee_facing_2026-11-04.pdf ./Replies_to_Referee_3_referee_facing_2026-11-04.pdf
          echo "----- BibTeX log -----"
          cat build/Replies_to_Referee_3_referee_facing_2026-11-04.blg || true
          echo "----- BBL bibliography items -----"
          grep -c '\\bibitem' build/Replies_to_Referee_3_referee_facing_2026-11-04.bbl || true

      - name: Validate final citations, cross-references, and PDF structure
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/reply.txt
          if grep -Eq '\[\?\]|\?\?' build/reply.txt; then
            echo "Unresolved [ ? ] or ?? placeholder found in extracted PDF text"
            exit 1
          fi
          pdfinfo Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdfinfo.txt
          pdffonts Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdffonts.txt
          if ! awk 'NR > 2 && $(NF-4) != "yes" { bad=1 } END { exit bad }' build/pdffonts.txt; then
            echo "At least one PDF font is not embedded"
            exit 1
          fi
          sha256sum Replies_to_Referee_3_referee_facing_2026-11-04.pdf | tee build/pdf-sha256.txt
          FINAL_LOG=build/Replies_to_Referee_3_referee_facing_2026-11-04.log
          BIB_LOG=build/Replies_to_Referee_3_referee_facing_2026-11-04.blg
          if grep -E "I couldn't open|I didn't find a database entry|Warning--I didn't find" "$BIB_LOG"; then
            echo "BibTeX reports missing or unreadable bibliography entries."
            exit 1
          fi
          if grep -E "Citation .* undefined|There were undefined references|Reference .* undefined" "$FINAL_LOG"; then
            echo "Unresolved citations or cross-references remain in the final LaTeX pass."
            exit 1
          fi
          if ! grep -q '\\bibitem' build/Replies_to_Referee_3_referee_facing_2026-11-04.bbl; then
            echo "The generated bibliography contains no bibitems."
            exit 1
          fi
          if grep -E "Overfull \\hbox|Overfull \\vbox" "$FINAL_LOG"; then
            echo "Overfull boxes require visual review; see the log."
          fi
          echo "Final .log contains no unresolved citation/reference warnings."
          echo "BibTeX .blg contains no missing-entry/database warnings."

      - name: Run source-preservation and PDF audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/audit-venv
          build/audit-venv/bin/pip install --disable-pip-version-check --no-deps pymupdf==1.26.7
          build/audit-venv/bin/python research/stellar-cooling-constraints-20261105/audit_reply.py

      - name: Render every page and create local contact sheets for visual QA
        run: |
          set -euo pipefail
          pdftoppm -png -r 150 Replies_to_Referee_3_referee_facing_2026-11-04.pdf build/pages/page
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import base64, io, re
          pages = sorted(Path("build/pages").glob("page-*.png"),
                         key=lambda p: int(re.search(r"-(\d+)\.png$", p.name).group(1)))
          if not pages:
              raise SystemExit("No PDF pages rendered")
          for batch_start in range(0, len(pages), 6):
              batch = pages[batch_start:batch_start+6]
              sheet = Image.new("RGB", (1120, 2400), (225,225,225))
              for local_i, p in enumerate(batch):
                  im = Image.open(p).convert("RGB")
                  im.thumbnail((540, 760))
                  tile = Image.new("RGB", (560, 800), "white")
                  tile.paste(im, ((560-im.width)//2, 28))
                  ImageDraw.Draw(tile).text((12, 6), f"PDF page {batch_start+local_i+1}", fill="black")
                  sheet.paste(tile, ((local_i%2)*560, (local_i//2)*800))
              buf = io.BytesIO()
              sheet.crop((0,0,1120,((len(batch)+1)//2)*800)).save(buf, format="JPEG", quality=82, optimize=True)
              encoded = base64.b64encode(buf.getvalue()).decode("ascii")
              svg = f'<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="{((len(batch)+1)//2)*800}" viewBox="0 0 1120 {((len(batch)+1)//2)*800}"><image width="1120" height="{((len(batch)+1)//2)*800}" href="data:image/jpeg;base64,{encoded}"/></svg>'
              out = Path("build/review") / f"pages-{batch_start+1:02d}-{batch_start+len(batch):02d}.svg"
              out.write_text(svg, encoding="utf-8")
          print(f"Rendered {len(pages)} pages at 150 dpi into {((len(pages)+5)//6)} contact sheets.")
          PY

      - name: Commit the compiled PDF
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "PR branch advanced during build; refusing to publish a stale PDF."
            exit 1
          fi
          git add Replies_to_Referee_3_referee_facing_2026-11-04.pdf
          git add research/stellar-cooling-constraints-20261105/outputs/reply_audit.json
          if git diff --cached --quiet; then
            echo "Compiled PDF and visual-review sheets are already current."
          else
            git commit -m "Update compiled referee response PDF [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi
