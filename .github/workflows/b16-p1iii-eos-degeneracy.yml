name: P1-IIIe Garching EOS nucleon occupation validation

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b16-p1iii-eos-degeneracy.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_nucleon_distribution.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_nucleon_distribution.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/sfho_eos_tables.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_sfho_realdata_closure.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/test_b16_p1iii_eos_sfho_realdata.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/build_caputo_profile_key_radii.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/map_caputo_sfho_eos_profile.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_profile_key_radii_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_key_radii_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_sfho_eos_profile_key_radii_2026-11-11.json'
      - 'research/stellar-cooling-constraints-20261105/data/T_caputo_vertices.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_composition_key_radii_2026-11-11.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/B16_P1IIIE_C_CAPUTO_PROFILE_TO_SFHO_EOS_2026-11-11.md'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/p1iii_eos_sfho_realdata_fixture.csv'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/sfho_frdm_v1.03_download.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/sfho_frdm_v1.03_manifest.sha256'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b16-p1iii-eos-degeneracy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eos-occupation:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy

      - name: Download, hash-check, and extract official SFHo v1.03 tables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export SFHO_TABLES_DIR="$RUNNER_TEMP/sfho_tables"
          echo "SFHO_TABLES_DIR=$SFHO_TABLES_DIR" >> "$GITHUB_ENV"
          mkdir -p raw "$SFHO_TABLES_DIR"
          gh release download sfho-frdm-v1.03-data \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'sfho_frdm_bin.zip' \
            --pattern 'sfho_frdm_spp.zip' \
            --pattern 'sfho_frdm_comp.zip' \
            --dir raw
          manifest='research/stellar-cooling-constraints-20261105/blinov_reproduction/sfho_frdm_v1.03_manifest.sha256'
          grep -E ' (sfho_frdm_bin\.zip|sfho_frdm_spp\.zip|sfho_frdm_comp\.zip)$' "$manifest" \
            | (cd raw && sha256sum --check -)
          unzip -j -o raw/sfho_frdm_bin.zip '*/sfho_frdm_eos_v1.03.bin' -d "$SFHO_TABLES_DIR"
          unzip -j -o raw/sfho_frdm_spp.zip 'sfho_frdm_spp_v1.03.tab' -d "$SFHO_TABLES_DIR"
          unzip -j -o raw/sfho_frdm_comp.zip '*/sfho_frdm_comp_v1.03.bin' -d "$SFHO_TABLES_DIR"
          test -s "$SFHO_TABLES_DIR/sfho_frdm_eos_v1.03.bin"
          test -s "$SFHO_TABLES_DIR/sfho_frdm_spp_v1.03.tab"
          test -s "$SFHO_TABLES_DIR/sfho_frdm_comp_v1.03.bin"
          du -h "$SFHO_TABLES_DIR"/*

      - name: Run EOS occupation unit tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_p1iii_eos_nucleon_distribution.py' -v

      - name: Run SFHo real-table closure tests
        run: |
          python -m unittest discover \
            -s research/stellar-cooling-constraints-20261105/blinov_reproduction \
            -p 'test_b16_p1iii_eos_sfho_realdata.py' -v

      - name: Rebuild Caputo key-radius profile from audited figure inputs
        run: |
          set -euo pipefail
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/build_caputo_profile_key_radii.py --temperature-csv research/stellar-cooling-constraints-20261105/data/T_caputo_vertices.csv --composition-csv research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_composition_key_radii_2026-11-11.csv --profile-csv "$RUNNER_TEMP/caputo_profile_key_radii.csv" --provenance-json "$RUNNER_TEMP/caputo_profile_key_radii_provenance.json"
          cmp "$RUNNER_TEMP/caputo_profile_key_radii.csv" research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/caputo_profile_key_radii_2026-11-11.csv

      - name: Map Caputo key radii onto the SFHo EOS and validate local occupations
        run: |
          set -euo pipefail
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/map_caputo_sfho_eos_profile.py --profile "$RUNNER_TEMP/caputo_profile_key_radii.csv" --tables-dir "$SFHO_TABLES_DIR" --outdir "$RUNNER_TEMP/caputo_sfho_eos_profile"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "caputo_sfho_eos_profile" / "caputo_sfho_eos_profile_key_radii_2026-11-11.json"
          d = json.loads(p.read_text())
          c = d["composition_closure"]
          w = d["wrong_EOS_Yp_coordinate_diagnostic"]
          x = d["filling_factor_closure"]
          n = d["occupation_density_closure"]
          f = d["local_degeneracy_factors"]
          q = d["quadrature"]
          assert d["number_of_key_radii"] == 10
          assert c["Xn_EOS_minus_Yn_Caputo_max_abs"] < 3e-5
          assert c["Xp_EOS_minus_Yp_Caputo_max_abs"] < 2e-5
          assert c["Xcluster_EOS_minus_Caputo_max_abs"] < 3e-5
          assert x["xi_SPP_minus_Caputo_inferred_max_abs"] < 2e-4
          assert n["neutron_rel_residual_max_abs"] < 2e-3
          assert n["proton_rel_residual_max_abs"] < 7e-3
          assert n["max_abs_delta_nu_n_MeV"] < 0.12
          assert n["max_abs_delta_nu_p_MeV"] < 0.18
          assert w["Xn_max_abs_error"] > 0.05
          assert w["Xcluster_max_abs_error"] > 0.04
          assert f["Fnn_EOS_vs_density_matched_max_abs_difference"] < 4e-4
          assert f["Fpp_EOS_vs_density_matched_max_abs_difference"] < 4e-4
          assert q["max_abs_n_relative_change_2048_vs_512"] < 1e-10
          assert q["max_abs_F_change_2048_vs_512"] < 1e-10
          print(json.dumps({"composition_closure": c, "wrong_coordinate": w, "filling_factor": x, "density_closure": n, "local_degeneracy": f, "quadrature": q}, indent=2))
          PY

      - name: Run deterministic software self-test
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_p1iii_eos_nucleon_distribution.py \
            --self-test \
            --output /tmp/p1iii_eos_kernel_self_test.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/p1iii_eos_kernel_self_test.json').read_text())
          assert data['software_test_only'] is True
          assert data['not_garching_profile_data'] is True
          checks = data['checks']
          assert checks['max_derivative_identity_abs_residual'] < 2e-9
          assert checks['max_256_vs_512_quadrature_abs_difference'] < 1e-10
          assert checks['vacuum_mass_limit_max_occupation_abs_residual'] < 1e-14
          assert abs(checks['dilute_limit_Fdeg'] - 1.0) < 1e-12
          assert checks['common_U_mu_shift_Fdeg_abs_residual'] < 1e-14
          assert checks['Hempel_RMF_mapping_max_abs_residual_MeV'] < 5e-13
          assert checks['density_inversion_nu_abs_residual_MeV'] < 1e-8
          assert 0.0 < checks['composition_inferred_xi_fixture'] <= 1.0
          print(json.dumps(checks, indent=2))
          PY
