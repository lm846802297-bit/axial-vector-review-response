name: Bollig Fig. 4 muon degeneracy profile audit

on:
  push:
    branches:
      - codex/major44-axial-cooling-constraints-20261105
    paths:
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/inspect_bollig_fig4_pdf.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_muon_chemical_potential_provenance.py'
      - '.github/workflows/bollig-fig4-muon-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bollig-fig4-muon-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref_name == 'codex/major44-axial-cooling-constraints-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install numpy scipy pymupdf
      - name: Download public Bollig v7 PDF
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://arxiv.org/pdf/2005.07141v7 \
            --output /tmp/bollig-2005.07141v7.pdf
      - name: Inventory Fig. 4 vector paths
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/inspect_bollig_fig4_pdf.py \
            --pdf /tmp/bollig-2005.07141v7.pdf \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig4_vector_inventory.json
      - name: Audit Caputo and Ferreira against Bollig public figures
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_muon_chemical_potential_provenance.py
      - name: Commit public figure geometry metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig4_vector_inventory.json
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig4_sfho188_muon_degeneracy.csv
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/bollig_fig3_sfho188_muon_density.csv
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/muon_chemical_potential_provenance_audit.json
          if git diff --cached --quiet; then
            echo "Bollig Fig. 4 vector inventory is unchanged."
          else
            git commit -m "Archive Bollig Fig. 4 public PDF vector inventory"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
