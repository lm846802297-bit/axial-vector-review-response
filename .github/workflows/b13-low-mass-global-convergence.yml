name: B.13 low-mass global transport convergence

on:
  push:
    branches:
      - research/moving-muon-thermal-rates-20261107
    paths:
      - '.github/workflows/b13-low-mass-global-convergence.yml'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_convergence.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_summary_vertex_preserving_0p1mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_transport_summary_vertex_preserving_1mev_2026-11-09.json'
      - 'research/stellar-cooling-constraints-20261105/finite_mixing/moving_muon_compton.py'
      - 'research/stellar-cooling-constraints-20261105/data/sfho188_digitized.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b13-low-mass-global-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convergence:
    if: github.ref_name == 'research/moving-muon-thermal-rates-20261107'
    name: Global convergence - ${{ matrix.mass }} MeV
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mass: 0.1
            tag: 0p1
          - mass: 1.0
            tag: 1
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Compile B.13/B.16 audit code
        run: |
          python -m py_compile \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_convergence.py \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_transport.py \
            research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b16_global_redshift.py
      - name: Run B.13 and B.16 regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python -m unittest discover -s research/stellar-cooling-constraints-20261105/blinov_reproduction -p 'test_b13_global_transport.py' -v
          python -m unittest discover -s research/stellar-cooling-constraints-20261105/blinov_reproduction -p 'test_b16_global_redshift.py' -v
      - name: Run full B.13 global convergence scan
        env:
          PYTHONPATH: ${{ github.workspace }}/research/stellar-cooling-constraints-20261105
        run: |
          python research/stellar-cooling-constraints-20261105/blinov_reproduction/audit_b13_global_convergence.py \
            --mass ${{ matrix.mass }} \
            --kernel-orders 12,8,8,8 \
            --refined-orders 16,10,10,10 \
            --active-threshold 1e-8 \
            --output research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_convergence_vertex_preserving_${{ matrix.tag }}mev_2026-11-09.json
      - name: Verify numerical records and production isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mass = float("${{ matrix.mass }}")
          tag = "${{ matrix.tag }}"
          p = Path(f"research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_convergence_vertex_preserving_{tag}mev_2026-11-09.json")
          d = json.loads(p.read_text())
          assert d["mass_MeV"] == mass
          assert len(d["scans"]) == 9
          assert d["reference"]["profile_sha256"] == "9fb14e796d6e7731f21993632af43ba2c6ed642ffe66b1e9de8ccbac240c001c"
          assert all(x["B16_baseline_reproduction_residual"] < 2e-10 for x in d["scans"])
          assert d["kernel_order_scan"]["B16_baseline_reproduction_residual"] < 2e-10
          print(json.dumps({
            "mass_MeV": mass,
            "overall_grid_passed": d["overall_grid_passed"],
            "kernel_order_acceptance": d["kernel_order_acceptance"],
            "overall_passed": d["overall_passed"],
            "pairwise_convergence": d["pairwise_convergence"]
          }, indent=2))
          PY
          git diff --exit-code -- \
            research/stellar-cooling-constraints-20261105/rates.py \
            research/stellar-cooling-constraints-20261105/transport.py \
            research/stellar-cooling-constraints-20261105/outputs/axial.json \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.pdf \
            research/stellar-cooling-constraints-20261105/outputs/axial_stellar_constraints.png
      - name: Archive B.13 low-mass convergence report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stellar-cooling-constraints-20261105/blinov_reproduction/outputs/b13_global_convergence_vertex_preserving_${{ matrix.tag }}mev_2026-11-09.json
          git commit -m "Archive B.13 global convergence at ${{ matrix.mass }} MeV"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
