<text x="125" y="718" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#596579">Scalar constraints act on yₛμμ. Mapping to (mₐ′, gₓ) requires the stated UV benchmark; they are not direct pure-axial A′ limits.</text>
